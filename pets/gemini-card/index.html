      // Draw 小星灵's expressive eyes (NO eyebrows, NO mouth, NO limbs!)
      function drawStarEyes(c, pose, time) {
        c.save();
        const eyeSpacing = 31;
        const baseEyeY = -4 + pose.gazeY;
        const leftX = -eyeSpacing + pose.gazeX;
        const rightX = eyeSpacing + pose.gazeX;

        // Soft rosy cheek blushes beneath outer eye corners
        if (pose.blushAlpha > 0.02) {
          c.save();
          c.fillStyle = `rgba(255, 118, 132, ${pose.blushAlpha})`;
          c.beginPath();
          c.ellipse(leftX - 18, baseEyeY + 18, 13, 7.5, -0.1, 0, Math.PI * 2);
          c.ellipse(rightX + 18, baseEyeY + 18, 13, 7.5, 0.1, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }

        const eyeColor = '#2E2321';
        c.strokeStyle = eyeColor;
        c.fillStyle = eyeColor;
        c.lineCap = 'round';
        c.lineJoin = 'round';

        if (pose.eyeMode === 'happyArc') {
          // 高兴：饱满弯弯的月牙笑眼 (︵ ︵)
          c.lineWidth = 6.2;
          [-1, 1].forEach((dir) => {
            const ex = dir === -1 ? leftX : rightX;
            c.beginPath();
            c.moveTo(ex - 13, baseEyeY + 6);
            c.quadraticCurveTo(ex, baseEyeY - 12, ex + 13, baseEyeY + 6);
            c.stroke();
          });

        } else if (pose.eyeMode === 'sleepArc') {
          // 睡觉：安详柔和的下弯闭合眼弧 (︶ ︶)
          c.lineWidth = 5.6;
          [-1, 1].forEach((dir) => {
            const ex = dir === -1 ? leftX : rightX;
            c.beginPath();
            c.moveTo(ex - 12, baseEyeY - 2);
            c.quadraticCurveTo(ex, baseEyeY + 11, ex + 12, baseEyeY - 2);
            c.stroke();
          });

        } else if (pose.eyeMode === 'petSquint') {
          // 抚摸：享受依偎的眯眯眼 (> < 圆润手绘弧角)
          c.lineWidth = 5.8;
          // Left eye '>'
          c.beginPath();
          c.moveTo(leftX - 11, baseEyeY - 8);
          c.quadraticCurveTo(leftX + 9, baseEyeY, leftX - 11, baseEyeY + 9);
          c.stroke();
          // Right eye '<'
          c.beginPath();
          c.moveTo(rightX + 11, baseEyeY - 8);
          c.quadraticCurveTo(rightX - 9, baseEyeY, rightX + 11, baseEyeY + 9);
          c.stroke();

        } else if (pose.eyeMode === 'sadDroop') {
          // 难受：不加眉毛！直接通过眼睛自身上缘向外倾斜下垂(八字半阖眼) + 眼底水光表达难受
          [-1, 1].forEach((dir) => {
            const ex = dir === -1 ? leftX : rightX;
            c.save();
            c.translate(ex, baseEyeY + 3);
            // Clip top of eye on an outward downward slope so the eye shape itself droops sadly
            c.beginPath();
            if (dir === -1) {
              c.moveTo(-16, 4);
              c.lineTo(16, -9);
              c.lineTo(16, 22);
              c.lineTo(-16, 22);
            } else {
              c.moveTo(-16, -9);
              c.lineTo(16, 4);
              c.lineTo(16, 22);
              c.lineTo(-16, 22);
            }
            c.closePath();
            c.clip();

            // Dark oval eye body
            c.fillStyle = eyeColor;
            c.beginPath();
            c.ellipse(0, 2, 11.5, 13.5, 0, 0, Math.PI * 2);
            c.fill();

            // Shimmering watery highlight at bottom + trembling catchlight
            const shimmerX = Math.sin(time * 16) * 1.2;
            c.fillStyle = '#FFFFFF';
            c.beginPath();
            c.arc(-3.5 + shimmerX, 1, 3.8, 0, Math.PI * 2);
            c.fill();
            c.fillStyle = '#BCE6FF';
            c.beginPath();
            c.ellipse(1, 10, 6.5, 2.8, 0, 0, Math.PI * 2);
            c.fill();
            c.restore();

            // Draw the upper eyelid crease directly along the eye's own top edge (part of the eye rim, not an eyebrow)
            c.strokeStyle = eyeColor;
            c.lineWidth = 4.8;
            c.beginPath();
            if (dir === -1) {
              c.moveTo(ex - 13, baseEyeY + 6);
              c.quadraticCurveTo(ex, baseEyeY, ex + 12, baseEyeY - 5);
            } else {
              c.moveTo(ex - 12, baseEyeY - 5);
              c.quadraticCurveTo(ex, baseEyeY, ex + 13, baseEyeY + 6);
            }
            c.stroke();
          });

        } else if (pose.eyeMode === 'angryGlare') {
          // 生气：不加眉毛！直接通过眼睛自身上缘向内压紧成锐利斜切角 + 聚焦瞳孔高光表达生气
          [-1, 1].forEach((dir) => {
            const ex = dir === -1 ? leftX : rightX;
            c.save();
            c.translate(ex, baseEyeY);
            c.beginPath();
            if (dir === -1) {
              c.moveTo(-16, -10);
              c.lineTo(16, 4);
              c.lineTo(16, 20);
              c.lineTo(-16, 20);
            } else {
              c.moveTo(-16, 4);
              c.lineTo(16, -10);
              c.lineTo(16, 20);
              c.lineTo(-16, 20);
            }
            c.closePath();
            c.clip();

            c.fillStyle = eyeColor;
            c.beginPath();
            c.ellipse(0, 1, 12, 13, 0, 0, Math.PI * 2);
            c.fill();

            // Focused sharp catchlight
            c.fillStyle = '#FFFFFF';
            c.beginPath();
            c.arc(dir * 2.5, 2.5, 3.4, 0, Math.PI * 2);
            c.fill();
            c.restore();

            // Upper eye rim slant (directly attached to eye contour)
            c.strokeStyle = eyeColor;
            c.lineWidth = 5.2;
            c.beginPath();
            if (dir === -1) {
              c.moveTo(ex - 13, baseEyeY - 7);
              c.lineTo(ex + 12, baseEyeY + 4);
            } else {
              c.moveTo(ex - 12, baseEyeY + 4);
              c.lineTo(ex + 13, baseEyeY - 7);
            }
            c.stroke();
          });

        } else if (pose.eyeMode === 'celebrateStar') {
          // 庆祝 / 灵光一现：明亮圆睁的大眼睛 + 瞳孔中央闪耀四角星光高光！
          [-1, 1].forEach((dir) => {
            const ex = dir === -1 ? leftX : rightX;
            c.fillStyle = eyeColor;
            c.beginPath();
            c.ellipse(ex, baseEyeY, 12.2, 15.2, 0, 0, Math.PI * 2);
            c.fill();

            // Golden-white 4-point star sparkle inside the eye
            c.fillStyle = '#FFF8D6';
            drawSmallStarShape(c, ex - 2, baseEyeY - 3, 7.5, 2.8, 0);
            c.fill();

            // Secondary crisp white dot
            c.fillStyle = '#FFFFFF';
            c.beginPath();
            c.arc(ex + 4.5, baseEyeY + 5.5, 2.6, 0, Math.PI * 2);
            c.fill();
          });

        } else if (pose.eyeMode === 'wideSurprise') {
          // 被抓起：圆溜溜惊讶聚焦的小眼睛
          [-1, 1].forEach((dir) => {
            const ex = dir === -1 ? leftX : rightX;
            c.fillStyle = eyeColor;
            c.beginPath();
            c.ellipse(ex, baseEyeY, 12.5, 13.5, 0, 0, Math.PI * 2);
            c.fill();

            // Smaller high-contrast catchlight for surprised look
            c.fillStyle = '#FFFFFF';
            c.beginPath();
            c.arc(ex - 3.2, baseEyeY - 3.5, 3.6, 0, Math.PI * 2);
            c.fill();
            c.beginPath();
            c.arc(ex + 3.8, baseEyeY + 4.2, 1.8, 0, Math.PI * 2);
            c.fill();
          });

        } else {
          // 待机 / 关注：清晰灵动的小眼睛（支持自然眨眼开合）
          const rx = 11.2 * pose.eyeScaleX;
          const ry = Math.max(1.8, 14.2 * pose.eyeScaleY);
          [-1, 1].forEach((dir) => {
            const ex = dir === -1 ? leftX : rightX;
            c.fillStyle = eyeColor;
            c.beginPath();
            c.ellipse(ex, baseEyeY, rx, ry, 0, 0, Math.PI * 2);
            c.fill();

            if (pose.eyeScaleY > 0.35) {
              c.fillStyle = '#FFFFFF';
              c.beginPath();
              c.arc(ex - 3.5, baseEyeY - 4.2, 4.2, 0, Math.PI * 2);
              c.fill();
              c.beginPath();
              c.arc(ex + 3.8, baseEyeY + 4.5, 2.0, 0, Math.PI * 2);
              c.fill();
            }
          });
        }

        c.restore();
      }

      // Draw 小星灵 character at (cx, cy)
      function drawXiaoXingLing(c, cx, cy, pose, time, scaleMultiplier) {
        const sMult = scaleMultiplier || 1;
        c.save();
        c.translate(cx + pose.offsetX * sMult, cy + pose.offsetY * sMult);
        c.scale(sMult, sMult);
        c.rotate(pose.rotation);

        // 1. Soft outer starlight aura when glowing / celebrating / having an idea
        if (pose.glowIntensity > 0.08) {
          c.save();
          const auraRadius = 175 + pose.glowIntensity * 45;
          const auraGrad = c.createRadialGradient(0, 0, 35, 0, 0, auraRadius);
          auraGrad.addColorStop(0, `rgba(255, 236, 153, ${0.55 * pose.glowIntensity})`);
          auraGrad.addColorStop(0.55, `rgba(255, 182, 193, ${0.24 * pose.glowIntensity})`);
          auraGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          c.fillStyle = auraGrad;
          c.beginPath();
          c.arc(0, 0, auraRadius, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }

        const pts = computeStarContourPoints(pose);

        // 2. White Hand-Cut Sticker Outer Border + Subtle Drop Shadow
        c.save();
        c.shadowColor = 'rgba(74, 62, 61, 0.14)';
        c.shadowBlur = 16;
        c.shadowOffsetY = 8;
        traceSmoothClosedContour(c, pts);
        c.lineJoin = 'round';
        c.lineCap = 'round';
        c.strokeStyle = '#FFFDF9';
        c.lineWidth = 15;
        c.stroke();
        c.restore();

        // 3. Clip inside the continuous star contour and paint the Red-Yellow-Green-Blue soft gradient!
        c.save();
        traceSmoothClosedContour(c, pts);
        c.clip();

        // Base warm cream fill
        c.fillStyle = '#FFF8EE';
        c.fillRect(-220, -220, 440, 440);

        // Soft 4-color gradient zones (Red, Yellow, Green, Blue evenly distributed across the 4 star points & plump body):
        // Top Star Point: Soft Coral Red
        const redGrad = c.createRadialGradient(0, -92, 8, 0, -65, 165);
        redGrad.addColorStop(0, 'rgba(255, 116, 116, 0.95)');
        redGrad.addColorStop(0.52, 'rgba(255, 150, 142, 0.62)');
        redGrad.addColorStop(1, 'rgba(255, 150, 142, 0)');
        c.fillStyle = redGrad;
        c.fillRect(-220, -220, 440, 440);

        // Right Star Point: Warm Buttercup Yellow
        const yellowGrad = c.createRadialGradient(92, 0, 8, 65, 0, 165);
        yellowGrad.addColorStop(0, 'rgba(255, 210, 76, 0.95)');
        yellowGrad.addColorStop(0.52, 'rgba(255, 225, 122, 0.62)');
        yellowGrad.addColorStop(1, 'rgba(255, 225, 122, 0)');
        c.fillStyle = yellowGrad;
        c.fillRect(-220, -220, 440, 440);

        // Left Star Point: Gentle Sky Blue
        const blueGrad = c.createRadialGradient(-92, 0, 8, -65, 0, 165);
        blueGrad.addColorStop(0, 'rgba(108, 192, 255, 0.92)');
        blueGrad.addColorStop(0.52, 'rgba(146, 212, 255, 0.58)');
        blueGrad.addColorStop(1, 'rgba(146, 212, 255, 0)');
        c.fillStyle = blueGrad;
        c.fillRect(-220, -220, 440, 440);

        // Bottom Star Point: Soft Mint Green
        const greenGrad = c.createRadialGradient(0, 92, 8, 0, 65, 165);
        greenGrad.addColorStop(0, 'rgba(88, 222, 172, 0.92)');
        greenGrad.addColorStop(0.52, 'rgba(128, 236, 195, 0.58)');
        greenGrad.addColorStop(1, 'rgba(128, 236, 195, 0)');
        c.fillStyle = greenGrad;
        c.fillRect(-220, -220, 440, 440);

        // Angry warm flush overlay when angry
        if (pose.angryTint > 0.02) {
          const angryGrad = c.createRadialGradient(0, -35, 10, 0, 0, 155);
          angryGrad.addColorStop(0, `rgba(255, 90, 90, ${0.42 * pose.angryTint})`);
          angryGrad.addColorStop(1, 'rgba(255, 90, 90, 0)');
          c.fillStyle = angryGrad;
          c.fillRect(-220, -220, 440, 440);
        }

        // Sad subtle desaturation/shadow when sad
        if (pose.sadDim > 0.02) {
          c.fillStyle = `rgba(115, 138, 168, ${0.22 * pose.sadDim})`;
          c.fillRect(-220, -220, 440, 440);
        }

        // Plump 3D volume highlight (top-left soft specular sheen) & bottom rim warmth
        const sheenGrad = c.createRadialGradient(-28, -44, 6, -20, -30, 110);
        sheenGrad.addColorStop(0, `rgba(255, 255, 255, ${0.42 + pose.glowIntensity * 0.35})`);
        sheenGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        c.fillStyle = sheenGrad;
        c.fillRect(-220, -220, 440, 440);

        // Crayon / Paper Grain Overlay inside the body
        const pat = c.createPattern(grainCanvas, 'repeat');
        if (pat) {
          c.fillStyle = pat;
          c.fillRect(-220, -220, 440, 440);
        }
        c.restore();

        // 4. Natural Hand-Drawn Charcoal Crayon Outline
        c.save();
        traceSmoothClosedContour(c, pts);
        c.lineJoin = 'round';
        c.lineCap = 'round';
        c.strokeStyle = '#463A38';
        c.lineWidth = 4.6;
        c.stroke();

        // Second subtle textured crayon pass for authentic hand-drawn warmth
        c.strokeStyle = 'rgba(70, 58, 56, 0.32)';
        c.lineWidth = 6.4;
        c.setLineDash([14, 9, 6, 11]);
        c.stroke();
        c.setLineDash([]);
        c.restore();

        // 5. Central Small Eyes
        drawStarEyes(c, pose, time);

        // 6. State-specific subtle comic accents (angry taut sparks)
        if (pet.state === 'angry') {
          c.save();
          const pulse = 1 + Math.sin(time * 24) * 0.18;
          c.strokeStyle = '#FF5A5A';
          c.lineWidth = 3.6;
          c.lineCap = 'round';
          // Small comic tension mark near upper-right star tip
          c.translate(88 * pulse, -82 * pulse);
          c.beginPath();
          c.moveTo(-10, -3); c.lineTo(-3, -3); c.lineTo(-3, -10);
          c.moveTo(10, -3); c.lineTo(3, -3); c.lineTo(3, -10);
          c.moveTo(-10, 3); c.lineTo(-3, 3); c.lineTo(-3, 10);
          c.moveTo(10, 3); c.lineTo(3, 3); c.lineTo(3, 10);
          c.stroke();
          c.restore();
        }

        c.restore();
      }

      // Draw active colorful props & particles (confetti, ribbons, hearts, sparkles, sleep bubbles)
      function drawParticles(c) {
        for (let i = 0; i < pet.particles.length; i++) {
          const pt = pet.particles[i];
          c.save();
          c.globalAlpha = clamp(pt.alpha, 0, 1);
          c.translate(pt.x, pt.y);

          if (pt.kind === 'confetti') {
            c.rotate(pt.rot);
            const flipScaleY = Math.cos(pt.flipPhase);
            c.scale(1, Math.abs(flipScaleY) < 0.18 ? 0.18 : flipScaleY);
            c.fillStyle = pt.color;
            c.strokeStyle = '#4A3E3D';
            c.lineWidth = 2;

            if (pt.shape === 'rect') {
              drawRoundedRect(c, -pt.size * 0.6, -pt.size * 0.38, pt.size * 1.2, pt.size * 0.76, 3);
              c.fill();
              c.stroke();
            } else if (pt.shape === 'star') {
              drawSmallStarShape(c, 0, 0, pt.size * 0.75, pt.size * 0.36, 0);
              c.fill();
              c.stroke();
            } else if (pt.shape === 'circle') {
              c.beginPath();
              c.arc(0, 0, pt.size * 0.45, 0, Math.PI * 2);
              c.fill();
              c.stroke();
            } else if (pt.shape === 'ribbon') {
              // Wavy colorful paper streamer ribbon
              c.beginPath();
              c.moveTo(-pt.size, -3);
              c.quadraticCurveTo(-pt.size * 0.3, -11, 0, -2);
              c.quadraticCurveTo(pt.size * 0.4, 7, pt.size, -1);
              c.lineTo(pt.size, 5);
              c.quadraticCurveTo(pt.size * 0.4, 13, 0, 4);
              c.quadraticCurveTo(-pt.size * 0.3, -5, -pt.size, 3);
              c.closePath();
              c.fill();
              c.stroke();
            }

          } else if (pt.kind === 'heart') {
            c.rotate(pt.rot);
            c.fillStyle = pt.color;
            c.strokeStyle = '#4A3E3D';
            c.lineWidth = 2.4;
            drawHeartShape(c, 0, 0, pt.size);
            c.fill();
            c.stroke();

          } else if (pt.kind === 'sparkle') {
            c.fillStyle = pt.color;
            c.strokeStyle = '#4A3E3D';
            c.lineWidth = 2;
            drawSmallStarShape(c, 0, 0, pt.size, pt.size * 0.42, pt.age * 3);
            c.fill();
            c.stroke();

          } else if (pt.kind === 'sleepBubble') {
            c.fillStyle = 'rgba(205, 232, 255, 0.75)';
            c.strokeStyle = '#5C4D4B';
            c.lineWidth = 2.2;
            c.beginPath();
            c.arc(0, 0, pt.size, 0, Math.PI * 2);
            c.fill();
            c.stroke();
            c.fillStyle = '#FFFFFF';
            c.beginPath();
            c.arc(-pt.size * 0.3, -pt.size * 0.3, pt.size * 0.25, 0, Math.PI * 2);
            c.fill();
          }

          c.restore();
        }
      }

      // Main Render Function
      function renderScene() {
        ctx.clearRect(0, 0, W, H);
        drawDeskScene(ctx, pet.totalTime, pet.x, pet.y, pet.pose);
        drawXiaoXingLing(ctx, pet.x, pet.y, pet.pose, pet.totalTime, 1);
        drawParticles(ctx);

        // Overall subtle paper-grain finish across the scene
        const pat = ctx.createPattern(grainCanvas, 'repeat');
        if (pat) {
          ctx.save();
          ctx.globalAlpha = 0.28;
          ctx.fillStyle = pat;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
      }

      // Render top header avatar icon
      function renderAvatar() {
        const avCanvas = document.getElementById('avatar-canvas');
        if (!avCanvas) return;
        const actx = avCanvas.getContext('2d');
        actx.clearRect(0, 0, 68, 68);
        const avatarPose = {
          offsetX: 0, offsetY: 2,
          scaleX: 1, scaleY: 1,
          rotation: -0.06,
          coreRadius: 84, lobeRadius: 58,
          tipScale0: 1, tipScale1: 1, tipScale2: 1, tipScale3: 1,
          tipDX0: 0, tipDY0: 0, tipDX1: 0, tipDY1: 0, tipDX2: 0, tipDY2: 0, tipDX3: 0, tipDY3: 0,
          eyeMode: 'normal', eyeScaleX: 1, eyeScaleY: 1,
          gazeX: 1, gazeY: -1,
          blushAlpha: 0.45, glowIntensity: 0.25, angryTint: 0, sadDim: 0
        };
        drawXiaoXingLing(actx, 34, 34, avatarPose, 0, 0.21);
      }

      // =========================================================================
      // 7. Pointer & Touch Interaction (Click to Pet, Hold & Drag to Grab, Proximity)
      // =========================================================================
      const sceneContainer = document.getElementById('scene-container');

      function getCanvasPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / Math.max(1, rect.width);
        const scaleY = H / Math.max(1, rect.height);
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function isPointOnPet(px, py) {
        const cx = pet.x + pet.pose.offsetX;
        const cy = pet.y + pet.pose.offsetY;
        return Math.hypot(px - cx, py - cy) <= 155;
      }

      sceneContainer.addEventListener('pointerdown', (e) => {
        ensureAudio();
        pet.lastInteractionTime = performance.now();
        const pt = getCanvasPoint(e.clientX, e.clientY);
        pet.pointerInScene = true;
        pet.pointerX = pt.x;
        pet.pointerY = pt.y;

        if (isPointOnPet(pt.x, pt.y)) {
          pet.pointerDownActive = true;
          pet.downStartX = pt.x;
          pet.downStartY = pt.y;
          pet.dragOffsetX = pet.x - pt.x;
          pet.dragOffsetY = pet.y - pt.y;
          try {
            sceneContainer.setPointerCapture(e.pointerId);
          } catch (err) {}

          // Start hold timer: if user holds for >190ms or drags >12px, enter 'drag' (grabbed) state
          clearTimeout(pet.dragHoldTimer);
          pet.dragHoldTimer = setTimeout(() => {
            if (pet.pointerDownActive && !pet.isDragging) {
              pet.isDragging = true;
              sceneContainer.classList.add('dragging');
              setPetState('drag');
            }
          }, 190);
        } else if (pet.state === 'sleep') {
          // Clicking anywhere in scene while sleeping gently wakes it up
          setPetState('idle');
        }
      });

      sceneContainer.addEventListener('pointermove', (e) => {
        const pt = getCanvasPoint(e.clientX, e.clientY);
        pet.pointerInScene = true;
        pet.pointerX = pt.x;
        pet.pointerY = pt.y;

        if (pet.pointerDownActive && !pet.isDragging) {
          const moved = Math.hypot(pt.x - pet.downStartX, pt.y - pet.downStartY);
          if (moved > 12) {
            clearTimeout(pet.dragHoldTimer);
            pet.isDragging = true;
            sceneContainer.classList.add('dragging');
            setPetState('drag');
          }
        }
      });

      function finishPointerInteraction(e) {
        clearTimeout(pet.dragHoldTimer);
        if (!pet.pointerDownActive) return;
        pet.pointerDownActive = false;

        if (pet.isDragging) {
          pet.isDragging = false;
          sceneContainer.classList.remove('dragging');
          setPetState('drop');
        } else {
          // Single tap/click on pet -> triggers one complete 3-phase 'pet' reaction!
          setPetState('pet');
        }
      }

      sceneContainer.addEventListener('pointerup', finishPointerInteraction);
      sceneContainer.addEventListener('pointercancel', finishPointerInteraction);
      sceneContainer.addEventListener('pointerleave', () => {
        if (!pet.isDragging) {
          pet.pointerInScene = false;
        }
      });

      // =========================================================================
      // 8. UI Controls: Emotion Buttons, Three-Dot Menu, In-Place Edit & Auto-Save
      // =========================================================================
      emotionButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          ensureAudio();
          const emotion = btn.getAttribute('data-emotion');
          setPetState(emotion);
        });
      });

      // Three-dot menu
      const menuBtn = document.getElementById('menu-btn');
      const menuPopover = document.getElementById('menu-popover');
      const themeChips = document.querySelectorAll('.theme-chip');
      const soundToggleBtn = document.getElementById('sound-toggle-btn');

      function applyTheme(themeName) {
        appState.theme = themeName;
        document.body.setAttribute('data-theme', themeName);
        safeSetStorage(STORAGE_KEYS.theme, themeName);
        themeChips.forEach((chip) => {
          chip.classList.toggle('active', chip.getAttribute('data-theme-choice') === themeName);
        });
      }

      function applySoundUI() {
        soundToggleBtn.textContent = appState.soundEnabled ? '开启' : '静音';
        soundToggleBtn.classList.toggle('muted', !appState.soundEnabled);
      }

      menuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = menuPopover.classList.toggle('open');
        menuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });

      document.addEventListener('click', (e) => {
        if (!menuPopover.contains(e.target) && e.target !== menuBtn) {
          menuPopover.classList.remove('open');
          menuBtn.setAttribute('aria-expanded', 'false');
        }
      });

      themeChips.forEach((chip) => {
        chip.addEventListener('click', () => {
          applyTheme(chip.getAttribute('data-theme-choice'));
        });
      });

      soundToggleBtn.addEventListener('click', () => {
        appState.soundEnabled = !appState.soundEnabled;
        safeSetStorage(STORAGE_KEYS.sound, appState.soundEnabled ? 'true' : 'false');
        applySoundUI();
        if (appState.soundEnabled) playSound('happy');
      });

      // In-Place Editing of Signature & Today's Message
      const captionBox = document.getElementById('caption-box');
      const editToggleBtn = document.getElementById('edit-toggle-btn');
      const displayFields = document.getElementById('display-fields');
      const authorDisplay = document.getElementById('author-display');
      const messageDisplay = document.getElementById('message-display');
      const authorInput = document.getElementById('author-input');
      const messageInput = document.getElementById('message-input');
      const dateDisplay = document.getElementById('date-display');

      function syncTextUI() {
        authorDisplay.textContent = appState.author || '星光桌伴';
        messageDisplay.textContent = appState.message || '歪一下脑袋观察新事物，想到好点子就突然亮起来！';
        authorInput.value = appState.author;
        messageInput.value = appState.message;
        dateDisplay.textContent = appState.dateString;
      }

      function saveEditedText() {
        const cleanAuthor = authorInput.value.trim() || '星光桌伴';
        const cleanMessage = messageInput.value.trim() || '歪一下脑袋观察新事物，想到好点子就突然亮起来！';
        appState.author = cleanAuthor;
        appState.message = cleanMessage;
        safeSetStorage(STORAGE_KEYS.author, cleanAuthor);
        safeSetStorage(STORAGE_KEYS.message, cleanMessage);
        authorDisplay.textContent = cleanAuthor;
        messageDisplay.textContent = cleanMessage;
      }

      function enterEditMode(focusTarget) {
        appState.isEditing = true;
        captionBox.classList.add('editing');
        authorInput.value = appState.author;
        messageInput.value = appState.message;
        pet.lastInteractionTime = performance.now();
        if (pet.state === 'sleep') setPetState('idle');
        pet.focusActive = true;
        pet.focusTimer = 4.0;
        setTimeout(() => {
          (focusTarget || messageInput).focus();
        }, 20);
      }

      function exitEditMode() {
        if (!appState.isEditing) return;
        saveEditedText();
        appState.isEditing = false;
        captionBox.classList.remove('editing');
        pet.ideaPulseTimer = 1.1;
        spawnIdeaSparkles(pet.x, pet.y - 25);
        playSound('idea');
      }

      editToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (appState.isEditing) {
          exitEditMode();
        } else {
          enterEditMode(messageInput);
        }
      });

      displayFields.addEventListener('click', (e) => {
        if (!appState.isEditing) {
          const targetInput = e.target === authorDisplay ? authorInput : messageInput;
          enterEditMode(targetInput);
        }
      });

      function onUserTyping() {
        saveEditedText();
        pet.lastInteractionTime = performance.now();
        if (pet.state === 'sleep') setPetState('idle');
        pet.focusActive = true;
        pet.focusTimer = 2.8;
        if (Math.random() < 0.35) {
          pet.ideaPulseTimer = 0.75;
        }
      }

      authorInput.addEventListener('input', onUserTyping);
      messageInput.addEventListener('input', onUserTyping);

      document.addEventListener('pointerdown', (e) => {
        if (appState.isEditing && !captionBox.contains(e.target)) {
          exitEditMode();
        }
      });

      // =========================================================================
      // 9. "分享这一刻" Full-Card High-DPI Image Exporter (Preserving Exact Moment)
      // =========================================================================
      const shareBtn = document.getElementById('share-btn');
      const shareModal = document.getElementById('share-modal');
      const modalCloseBtn = document.getElementById('modal-close-btn');
      const exportPreviewImg = document.getElementById('export-preview-img');
      const downloadImgBtn = document.getElementById('download-img-btn');
      const nativeShareBtn = document.getElementById('native-share-btn');
      let lastExportDataUrl = '';
      let lastExportBlob = null;

      function getThemePalette(themeName) {
        if (themeName === 'mint') {
          return {
            pageBg: '#EBF5F0',
            cardBg: '#FAFFFD',
            cardBorder: '#3B4A45',
            subBg: '#F0F9F5',
            textMain: '#2C3A35',
            textMuted: '#6E857D',
            btnBg: '#EBF7F2',
            btnBorder: '#BCE0D2',
            shareBg: '#3B4A45',
            shareText: '#FAFFFD'
          };
        } else if (themeName === 'lavender') {
          return {
            pageBg: '#F2EEF8',
            cardBg: '#FDFBFF',
            cardBorder: '#433B4F',
            subBg: '#F6F2FC',
            textMain: '#342D40',
            textMuted: '#7E738F',
            btnBg: '#F3EEFA',
            btnBorder: '#D2C4E8',
            shareBg: '#433B4F',
            shareText: '#FDFBFF'
          };
        }
        return {
          pageBg: '#F6F0E6',
          cardBg: '#FFFDF9',
          cardBorder: '#4A3E3D',
          subBg: '#FBF6EE',
          textMain: '#3A302E',
          textMuted: '#8C7A75',
          btnBg: '#FAF3E8',
          btnBorder: '#D9CBB8',
          shareBg: '#4A3E3D',
          shareText: '#FFFDF9'
        };
      }

      // Wrap multi-line text accurately for Canvas export
      function wrapCanvasText(c, text, maxWidth) {
        const paragraphs = String(text || '').split(/\r?\n/);
        const lines = [];
        for (let p = 0; p < paragraphs.length; p++) {
          const para = paragraphs[p];
          if (!para) {
            lines.push('');
            continue;
          }
          let currentLine = '';
          for (let i = 0; i < para.length; i++) {
            const ch = para[i];
            const testLine = currentLine + ch;
            if (c.measureText(testLine).width > maxWidth && currentLine.length > 0) {
              lines.push(currentLine);
              currentLine = ch;
            } else {
              currentLine = testLine;
            }
          }
          if (currentLine) lines.push(currentLine);
        }
        return lines.length ? lines : [''];
      }

      function generateFullCardSnapshot() {
        // Save any active in-place edits without resetting pet state!
        if (appState.isEditing) {
          saveEditedText();
        }
        // Render one fresh frame of the exact current state & particles
        renderScene();

        const pal = getThemePalette(appState.theme);
        const cardW = 760;
        const padX = 28;
        const headerH = 112;
        const sceneW = cardW;
        const sceneH = Math.round(cardW * (H / W)); // 714
        const actionRowH = 110;

        // Measure wrapped text lines at 2x resolution
        const measureCanvas = document.createElement('canvas');
        const mctx = measureCanvas.getContext('2d');
        const fontStack = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif';
        const textInnerMaxW = cardW - padX * 2 - 48 - 68;

        mctx.font = `800 28px ${fontStack}`;
        const authorLines = wrapCanvasText(mctx, appState.author, textInnerMaxW);

        mctx.font = `500 27px ${fontStack}`;
        const msgLines = wrapCanvasText(mctx, appState.message, textInnerMaxW);

        const authorLineH = 38;
        const msgLineH = 40;
        const captionBoxH = 38 + authorLines.length * authorLineH + 10 + msgLines.length * msgLineH;
        const dateH = 40;
        const shareBtnH = 84;
        const bodyTotalH = 24 + actionRowH + 22 + captionBoxH + 20 + dateH + 18 + shareBtnH + 28;

        const cardH = headerH + sceneH + bodyTotalH;
        const outerMargin = 28;
        const outW = cardW + outerMargin * 2;
        const outH = cardH + outerMargin * 2;

        const outCanvas = document.createElement('canvas');
        outCanvas.width = outW;
        outCanvas.height = outH;
        const c = outCanvas.getContext('2d');

        // 1. Page Background
        c.fillStyle = pal.pageBg;
        c.fillRect(0, 0, outW, outH);

        // 2. Card Base & Border
        const cx = outerMargin;
        const cy = outerMargin;
        c.save();
        c.fillStyle = 'rgba(74, 62, 61, 0.14)';
        drawRoundedRect(c, cx, cy + 12, cardW, cardH, 44);
        c.fill();

        c.fillStyle = pal.cardBg;
        c.strokeStyle = pal.cardBorder;
        c.lineWidth = 5;
        drawRoundedRect(c, cx, cy, cardW, cardH, 44);
        c.fill();
        c.stroke();
        c.restore();

        // 3. Top Header (Avatar + Name + Three Dots)
        const avCanvas = document.getElementById('avatar-canvas');
        c.save();
        c.fillStyle = '#FFF7EB';
        c.strokeStyle = pal.cardBorder;
        c.lineWidth = 4;
        c.beginPath();
        c.arc(cx + 64, cy + 56, 36, 0, Math.PI * 2);
        c.fill();
        c.stroke();
        if (avCanvas) {
          c.drawImage(avCanvas, cx + 30, cy + 22, 68, 68);
        }
        c.fillStyle = pal.textMain;
        c.font = `700 32px ${fontStack}`;
        c.textBaseline = 'middle';
        c.fillText('小星灵', cx + 118, cy + 57);

        // Three dots on right
        for (let i = 0; i < 3; i++) {
          c.beginPath();
          c.arc(cx + cardW - 76 + i * 16, cy + 56, 4.5, 0, Math.PI * 2);
          c.fill();
        }
        c.restore();

        // 4. Middle Pet Scene Snapshot (Live Pose, Expression & Colorful Particles)
        const sceneTop = cy + headerH;
        c.drawImage(canvas, cx, sceneTop, sceneW, sceneH);

        // 5. Five Emotion Action Buttons (Preserving Active Highlight Fill!)
        let curY = sceneTop + sceneH + 24;
        const buttonsMeta = [
          { id: 'happy', label: '高兴', activeBg: '#FFF0B8', activeFill: '#FFD15C' },
          { id: 'celebrate', label: '庆祝', activeBg: '#FFE3E8', activeFill: '#FF7B8B' },
          { id: 'sad', label: '难受', activeBg: '#DFF0FF', activeFill: '#7CC6FE' },
          { id: 'angry', label: '生气', activeBg: '#FFDAD6', activeFill: '#FF6B6B' },
          { id: 'sleep', label: '睡觉', activeBg: '#E2E6FF', activeFill: '#98A8F8' }
        ];
        const btnGap = 12;
        const btnW = (cardW - padX * 2 - btnGap * 4) / 5;

        buttonsMeta.forEach((b, idx) => {
          const bx = cx + padX + idx * (btnW + btnGap);
          const isActive = pet.state === b.id;
          c.save();
          c.fillStyle = isActive ? b.activeBg : pal.btnBg;
          c.strokeStyle = isActive ? pal.cardBorder : pal.btnBorder;
          c.lineWidth = isActive ? 4 : 3.5;
          drawRoundedRect(c, bx, curY, btnW, actionRowH, 26);
          c.fill();
          c.stroke();

          // Draw mini star icon inside button
          const iconCX = bx + btnW / 2;
          const iconCY = curY + 38;
          c.fillStyle = isActive ? b.activeFill : 'rgba(0,0,0,0)';
          c.strokeStyle = pal.textMain;
          c.lineWidth = 3.6;
          drawSmallStarShape(c, iconCX, iconCY, 20, 9.5, 0);
          if (isActive) c.fill();
          c.stroke();

          // Button label
          c.fillStyle = pal.textMain;
          c.font = `${isActive ? 700 : 600} 23px ${fontStack}`;
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(b.label, iconCX, curY + 84);
          c.restore();
        });

        // 6. Signature + Today's Message + Square-Pencil Edit Icon
        curY += actionRowH + 22;
        c.save();
        c.fillStyle = pal.subBg;
        c.strokeStyle = pal.btnBorder;
        c.lineWidth = 3.5;
        drawRoundedRect(c, cx + padX, curY, cardW - padX * 2, captionBoxH, 26);
        c.fill();
        c.stroke();

        let textY = curY + 24;
        const textX = cx + padX + 24;
        c.fillStyle = pal.textMain;
        c.font = `800 28px ${fontStack}`;
        c.textBaseline = 'top';
        authorLines.forEach((line) => {
          c.fillText(line, textX, textY);
          textY += authorLineH;
        });

        textY += 8;
        c.font = `500 27px ${fontStack}`;
        msgLines.forEach((line) => {
          c.fillText(line, textX, textY);
          textY += msgLineH;
        });

        // Square-pencil edit icon on top-right of caption box
        const editIconX = cx + cardW - padX - 74;
        const editIconY = curY + 20;
        c.fillStyle = pal.cardBg;
        c.strokeStyle = pal.btnBorder;
        c.lineWidth = 3;
        drawRoundedRect(c, editIconX, editIconY, 54, 54, 14);
        c.fill();
        c.stroke();

        c.strokeStyle = pal.textMain;
        c.lineWidth = 3.2;
        c.lineCap = 'round';
        c.lineJoin = 'round';
        drawRoundedRect(c, editIconX + 13, editIconY + 15, 24, 24, 4);
        c.stroke();
        c.beginPath();
        c.moveTo(editIconX + 26, editIconY + 28);
        c.lineTo(editIconX + 41, editIconY + 13);
        c.stroke();
        c.restore();

        // 7. Full Date (YYYY年MM月DD日)
        curY += captionBoxH + 20;
        c.save();
        c.fillStyle = pal.textMuted;
        c.font = `600 24px ${fontStack}`;
        c.textBaseline = 'top';
        c.fillText(appState.dateString, cx + padX + 4, curY);
        c.restore();

        // 8. Bottom "分享这一刻" Button
        curY += dateH + 18;
        c.save();
        c.fillStyle = pal.shareBg;
        c.strokeStyle = pal.cardBorder;
        c.lineWidth = 4;
        drawRoundedRect(c, cx + padX, curY, cardW - padX * 2, shareBtnH, 26);
        c.fill();
        c.stroke();

        c.fillStyle = pal.shareText;
        c.font = `700 29px ${fontStack}`;
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText('分享这一刻', cx + cardW / 2, curY + shareBtnH / 2 + 1);
        c.restore();

        // Outer border stroke on top of scene edges
        c.save();
        c.strokeStyle = pal.cardBorder;
        c.lineWidth = 5;
        drawRoundedRect(c, cx, cy, cardW, cardH, 44);
        c.stroke();
        c.restore();

        return outCanvas;
      }

      shareBtn.addEventListener('click', () => {
        ensureAudio();
        const outCanvas = generateFullCardSnapshot();
        lastExportDataUrl = outCanvas.toDataURL('image/png');
        exportPreviewImg.src = lastExportDataUrl;
        outCanvas.toBlob((blob) => {
          lastExportBlob = blob;
        }, 'image/png');
        shareModal.classList.add('open');
      });

      modalCloseBtn.addEventListener('click', () => {
        shareModal.classList.remove('open');
      });

      shareModal.addEventListener('click', (e) => {
        if (e.target === shareModal) {
          shareModal.classList.remove('open');
        }
      });

      downloadImgBtn.addEventListener('click', () => {
        if (!lastExportDataUrl) return;
        const link = document.createElement('a');
        link.href = lastExportDataUrl;
        link.download = `小星灵-${appState.dateString}.png`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      nativeShareBtn.addEventListener('click', async () => {
        if (navigator.share && lastExportBlob) {
          try {
            const file = new File([lastExportBlob], `小星灵-${appState.dateString}.png`, { type: 'image/png' });
            if (!navigator.canShare || navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: '小星灵',
                text: `${appState.author}：${appState.message}`,
                files: [file]
              });
              return;
            }
          } catch (err) {
            // Fall through to download fallback if user cancels or share fails
          }
        }
        downloadImgBtn.click();
      });

      // =========================================================================
      // 10. Initialization & Main Animation Loop
      // =========================================================================
      applyTheme(appState.theme);
      applySoundUI();
      syncTextUI();
      renderAvatar();
      syncEmotionButtons();

      let lastFrameTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
        lastFrameTime = now;
        updatePet(dt);
        renderScene();
        requestAnimationFrame(loop);
      }

      window.addEventListener('load', () => {
        lastFrameTime = performance.now();
        requestAnimationFrame(loop);
      });
    })();
  </script>
</body>
</html>
