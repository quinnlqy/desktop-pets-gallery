<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小星灵 - 桌面星光互动小宠物</title>
  <style>
    :root {
      --bg-page: #F6F0E6;
      --card-bg: #FFFDF9;
      --card-border: #4A3E3D;
      --card-sub-bg: #FBF6EE;
      --text-main: #3A302E;
      --text-muted: #8C7A75;
      --accent-fill: #FFD166;
      --accent-coral: #FF7B7B;
      --accent-mint: #52D1A6;
      --accent-sky: #6EC1F8;
      --btn-bg: #FAF3E8;
      --btn-border: #D9CBB8;
      --share-bg: #4A3E3D;
      --share-text: #FFFDF9;
    }

    [data-theme="mint"] {
      --bg-page: #EBF5F0;
      --card-bg: #FAFFFD;
      --card-border: #3B4A45;
      --card-sub-bg: #F0F9F5;
      --text-main: #2C3A35;
      --text-muted: #6E857D;
      --btn-bg: #EBF7F2;
      --btn-border: #BCE0D2;
      --share-bg: #3B4A45;
      --share-text: #FAFFFD;
    }

    [data-theme="lavender"] {
      --bg-page: #F2EEF8;
      --card-bg: #FDFBFF;
      --card-border: #433B4F;
      --card-sub-bg: #F6F2FC;
      --text-main: #342D40;
      --text-muted: #7E738F;
      --btn-bg: #F3EEFA;
      --btn-border: #D2C4E8;
      --share-bg: #433B4F;
      --share-text: #FDFBFF;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px 10px 24px;
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image: radial-gradient(rgba(74, 62, 61, 0.05) 1px, transparent 0);
      background-size: 18px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: background-color 0.3s ease;
      overflow-x: hidden;
    }

    /* Instagram-style Dynamic Card */
    .ig-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 2.5px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 8px 0 rgba(74, 62, 61, 0.12), 0 14px 28px rgba(74, 62, 61, 0.08);
      overflow: visible;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* 1. Top Header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 2px dashed rgba(74, 62, 61, 0.12);
      position: relative;
    }

    .profile-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-wrap {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFF7EB;
      border: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
    }

    .avatar-canvas {
      width: 34px;
      height: 34px;
      display: block;
    }

    .pet-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-main);
    }

    .menu-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.18s ease, transform 0.15s ease;
      padding: 0;
    }

    .menu-btn:hover,
    .menu-btn[aria-expanded="true"] {
      background: var(--btn-bg);
      border-color: var(--btn-border);
    }

    .menu-btn:active {
      transform: scale(0.94);
    }

    /* Three-dot popover menu */
    .menu-popover {
      position: absolute;
      top: 54px;
      right: 12px;
      width: 224px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(58, 48, 46, 0.16);
      padding: 12px;
      z-index: 40;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .menu-popover.open {
      display: flex;
    }

    .menu-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .theme-chip {
      border: 1.8px solid var(--btn-border);
      background: var(--btn-bg);
      border-radius: 10px;
      padding: 6px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .theme-chip.active {
      border-color: var(--card-border);
      background: #FFEFA6;
      box-shadow: 0 2px 0 rgba(74, 62, 61, 0.18);
    }

    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--card-border);
    }

    .sound-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px dashed rgba(74, 62, 61, 0.15);
    }

    .sound-toggle-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1.8px solid var(--card-border);
      background: #FFE58F;
      font-size: 12px;
      font-weight: 700;
      color: #3A302E;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .sound-toggle-btn.muted {
      background: #E9E2D8;
      color: #7D706C;
    }

    /* 2. Middle: Interactive Pet Scene */
    .scene-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 0.94;
      background: #FAF4EB;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
    }

    .scene-container.dragging {
      cursor: grabbing;
    }

    #pet-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 3. Below Scene: Strictly Ordered Controls & Content */
    .card-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 3.1 Five Action Buttons */
    .action-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .emotion-btn {
      appearance: none;
      border: 2px solid var(--btn-border);
      background: var(--btn-bg);
      border-radius: 14px;
      padding: 7px 2px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.12s ease, background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .emotion-btn:hover {
      border-color: var(--card-border);
    }

    .emotion-btn:active {
      transform: scale(0.94);
    }

    .emotion-btn svg {
      width: 24px;
      height: 24px;
      overflow: visible;
    }

    .emotion-btn .icon-fill {
      fill: transparent;
      transition: fill 0.2s ease;
    }

    .emotion-btn .icon-stroke {
      stroke: var(--text-main);
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Active filled states for each emotion button while playing */
    .emotion-btn.active {
      border-color: var(--card-border);
      transform: translateY(-1px);
      box-shadow: 0 3px 0 rgba(74, 62, 61, 0.2);
      font-weight: 700;
    }

    .emotion-btn[data-emotion="happy"].active {
      background: #FFF0B8;
    }
    .emotion-btn[data-emotion="happy"].active .icon-fill {
      fill: #FFD15C;
    }

    .emotion-btn[data-emotion="celebrate"].active {
      background: #FFE3E8;
    }
    .emotion-btn[data-emotion="celebrate"].active .icon-fill {
      fill: #FF7B8B;
    }

    .emotion-btn[data-emotion="sad"].active {
      background: #DFF0FF;
    }
    .emotion-btn[data-emotion="sad"].active .icon-fill {
      fill: #7CC6FE;
    }

    .emotion-btn[data-emotion="angry"].active {
      background: #FFDAD6;
    }
    .emotion-btn[data-emotion="angry"].active .icon-fill {
      fill: #FF6B6B;
    }

    .emotion-btn[data-emotion="sleep"].active {
      background: #E2E6FF;
    }
    .emotion-btn[data-emotion="sleep"].active .icon-fill {
      fill: #98A8F8;
    }

    /* 3.2 Customizable Signature & Today's Message */
    .caption-box {
      background: var(--card-sub-bg);
      border: 1.8px solid var(--btn-border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .caption-box.editing {
      border-color: var(--card-border);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.35);
    }

    .caption-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .caption-content-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .author-line {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .author-label {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      margin: 0;
    }

    .edit-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1.5px solid var(--btn-border);
      background: var(--card-bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      transition: all 0.15s ease;
    }

    .edit-btn:hover,
    .caption-box.editing .edit-btn {
      border-color: var(--card-border);
      background: #FFE58F;
    }

    .edit-fields {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .caption-box.editing .display-fields {
      display: none;
    }

    .caption-box.editing .edit-fields {
      display: flex;
    }

    .inline-input-author {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      background: #FAF6F0;
      border: 1.5px solid var(--btn-border);
      border-radius: 8px;
      padding: 5px 8px;
      outline: none;
    }

    .inline-input-author:focus,
    .inline-textarea-msg:focus {
      border-color: var(--card-border);
      background: #FFFDF9;
    }

    .inline-textarea-msg {
      width: 100%;
      min-height: 54px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-main);
      background: #FAF6F0;
      border: 1.5px solid var(--btn-border);
      border-radius: 8px;
      padding: 6px 8px;
      resize: vertical;
      outline: none;
    }

    /* 3.3 Full Year-Month-Day Date */
    .date-line {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      padding: 0 2px;
    }

    /* 3.4 Bottom Share Button */
    .share-btn {
      width: 100%;
      appearance: none;
      border: 2.2px solid var(--card-border);
      background: var(--share-bg);
      color: var(--share-text);
      border-radius: 14px;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 3px 0 rgba(74, 62, 61, 0.22);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .share-btn:hover {
      opacity: 0.94;
    }

    .share-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(74, 62, 61, 0.22);
    }

    /* Share Preview Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(42, 34, 32, 0.62);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 390px;
      max-height: 92vh;
      background: var(--card-bg);
      border: 2.5px solid var(--card-border);
      border-radius: 22px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      overflow-y: auto;
    }

    .modal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }

    .modal-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1.5px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-main);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-img-wrap {
      width: 100%;
      background: var(--bg-page);
      border-radius: 14px;
      padding: 8px;
      border: 1.5px dashed var(--btn-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #export-preview-img {
      width: 100%;
      height: auto;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      -webkit-touch-callout: default;
      user-select: auto;
    }

    .modal-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin: 0;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
    }

    .modal-action-btn {
      flex: 1;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid var(--card-border);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .modal-action-btn.primary {
      background: #FFD166;
      color: #3A302E;
    }

    .modal-action-btn.secondary {
      background: var(--btn-bg);
      color: var(--text-main);
    }

    @media (max-width: 420px) {
      body {
        padding: 6px 6px 18px;
      }
      .ig-card {
        border-radius: 20px;
      }
      .emotion-btn {
        font-size: 11.5px;
        padding: 6px 1px 5px;
      }
    }
  </style>
</head>
<body data-theme="cream">

  <article class="ig-card" id="ig-card">
    <!-- 1. 顶部：角色头像、名字、三点菜单 -->
    <header class="card-header">
      <div class="profile-group">
        <div class="avatar-wrap">
          <canvas id="avatar-canvas" class="avatar-canvas" width="68" height="68"></canvas>
        </div>
        <span class="pet-name">小星灵</span>
      </div>

      <button type="button" class="menu-btn" id="menu-btn" aria-label="更多设置" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="5" cy="12" r="2.2" fill="currentColor"/>
          <circle cx="12" cy="12" r="2.2" fill="currentColor"/>
          <circle cx="19" cy="12" r="2.2" fill="currentColor"/>
        </svg>
      </button>

      <!-- 三点菜单：配色与声音设置 -->
      <div class="menu-popover" id="menu-popover" role="dialog" aria-label="配色和声音设置">
        <div>
          <div class="menu-section-title">卡片配色</div>
          <div class="theme-options">
            <button type="button" class="theme-chip active" data-theme-choice="cream">
              <span class="theme-dot" style="background: #FFF6E5;"></span>
              <span>暖杏</span>
            </button>
            <button type="button" class="theme-chip" data-theme-choice="mint">
              <span class="theme-dot" style="background: #E2F7EE;"></span>
              <span>薄荷</span>
            </button>
            <button type="button" class="theme-chip" data-theme-choice="lavender">
              <span class="theme-dot" style="background: #EFE9FA;"></span>
              <span>星云</span>
            </button>
          </div>
        </div>
        <div class="sound-row">
          <span class="menu-section-title" style="margin: 0;">互动声音</span>
          <button type="button" class="sound-toggle-btn" id="sound-toggle-btn">开启</button>
        </div>
      </div>
    </header>

    <!-- 2. 中间：宠物场景 -->
    <div class="scene-container" id="scene-container">
      <canvas id="pet-canvas" width="800" height="752"></canvas>
    </div>

    <!-- 3. 下方依次排列：动作按钮 -> 署名和今天的话 -> 完整年月日 -> 分享这一刻 -->
    <div class="card-body">
      <!-- 3.1 高兴、庆祝、难受、生气、睡觉动作按钮 -->
      <div class="action-bar" role="group" aria-label="小星灵情绪动作">
        <button type="button" class="emotion-btn" data-emotion="happy" id="btn-happy">
          <svg viewBox="0 0 28 28">
            <path class="icon-fill" d="M14 3.5 C16.6 8.8 19.2 11.4 24.5 14 C19.2 16.6 16.6 19.2 14 24.5 C11.4 19.2 8.8 16.6 3.5 14 C8.8 11.4 11.4 8.8 14 3.5 Z"/>
            <path class="icon-stroke" d="M14 3.5 C16.6 8.8 19.2 11.4 24.5 14 C19.2 16.6 16.6 19.2 14 24.5 C11.4 19.2 8.8 16.6 3.5 14 C8.8 11.4 11.4 8.8 14 3.5 Z"/>
            <path class="icon-stroke" d="M10.2 13.8 Q11.5 11.8 12.8 13.8 M15.2 13.8 Q16.5 11.8 17.8 13.8"/>
          </svg>
          <span>高兴</span>
        </button>

        <button type="button" class="emotion-btn" data-emotion="celebrate" id="btn-celebrate">
          <svg viewBox="0 0 28 28">
            <path class="icon-fill" d="M14 3 C16.8 8.6 19.4 11.2 25 14 C19.4 16.8 16.8 19.4 14 25 C11.2 19.4 8.6 16.8 3 14 C8.6 11.2 11.2 8.6 14 3 Z"/>
            <path class="icon-stroke" d="M14 3 C16.8 8.6 19.4 11.2 25 14 C19.4 16.8 16.8 19.4 14 25 C11.2 19.4 8.6 16.8 3 14 C8.6 11.2 11.2 8.6 14 3 Z"/>
            <circle cx="6" cy="6.5" r="1.5" fill="#FF7B7B"/>
            <circle cx="22.5" cy="6.5" r="1.5" fill="#4CC9F0"/>
            <circle cx="22" cy="21.5" r="1.5" fill="#06D6A0"/>
            <circle cx="11.5" cy="13.5" r="1.2" fill="currentColor"/>
            <circle cx="16.5" cy="13.5" r="1.2" fill="currentColor"/>
          </svg>
          <span>庆祝</span>
        </button>

        <button type="button" class="emotion-btn" data-emotion="sad" id="btn-sad">
          <svg viewBox="0 0 28 28">
            <path class="icon-fill" d="M14 4.5 C16.4 9.5 19 12 24 14.8 C19 17.2 16.4 19.6 14 24.5 C11.6 19.6 9 17.2 4 14.8 C9 12 11.6 9.5 14 4.5 Z"/>
            <path class="icon-stroke" d="M14 4.5 C16.4 9.5 19 12 24 14.8 C19 17.2 16.4 19.6 14 24.5 C11.6 19.6 9 17.2 4 14.8 C9 12 11.6 9.5 14 4.5 Z"/>
            <path class="icon-stroke" d="M10 14.5 L12.6 13.5 M18 14.5 L15.4 13.5"/>
          </svg>
          <span>难受</span>
        </button>

        <button type="button" class="emotion-btn" data-emotion="angry" id="btn-angry">
          <svg viewBox="0 0 28 28">
            <path class="icon-fill" d="M14 3.2 C17 8.5 19.5 11 24.8 14 C19.5 17 17 19.5 14 24.8 C11 19.5 8.5 17 3.2 14 C8.5 11 11 8.5 14 3.2 Z"/>
            <path class="icon-stroke" d="M14 3.2 C17 8.5 19.5 11 24.8 14 C19.5 17 17 19.5 14 24.8 C11 19.5 8.5 17 3.2 14 C8.5 11 11 8.5 14 3.2 Z"/>
            <path class="icon-stroke" d="M10.2 12.8 L12.8 14.2 M17.8 12.8 L15.2 14.2"/>
          </svg>
          <span>生气</span>
        </button>

        <button type="button" class="emotion-btn" data-emotion="sleep" id="btn-sleep">
          <svg viewBox="0 0 28 28">
            <path class="icon-fill" d="M14 4 C16.5 9 19 11.5 24.2 14 C19 16.5 16.5 19 14 24 C11.5 19 9 16.5 3.8 14 C9 11.5 11.5 9 14 4 Z"/>
            <path class="icon-stroke" d="M14 4 C16.5 9 19 11.5 24.2 14 C19 16.5 16.5 19 14 24 C11.5 19 9 16.5 3.8 14 C9 11.5 11.5 9 14 4 Z"/>
            <path class="icon-stroke" d="M10.2 13.6 Q11.5 15.2 12.8 13.6 M15.2 13.6 Q16.5 15.2 17.8 13.6"/>

      <!-- 3.2 可自定义的署名和今天的话 + 方框铅笔编辑图标 -->
      <div class="caption-box" id="caption-box">
        <div class="caption-header-row">
          <div class="caption-content-area">

                <span class="author-label" id="author-display">星光桌伴</span>
              </div>
              <p class="message-text" id="message-display">歪一下脑袋观察新事物，想到好点子就突然亮起来！</p>
            </div>

            <div class="edit-fields" id="edit-fields">
              <input
                type="text"
                class="inline-input-author"
                id="author-input"
                maxlength="32"
                placeholder="输入署名..."
                aria-label="署名"

                class="inline-textarea-msg"
                id="message-input"
                rows="2"
                maxlength="200"

              ></textarea>

          <button type="button" class="edit-btn" id="edit-toggle-btn" aria-label="编辑署名和今天的话" title="点击编辑">
            <!-- 方框铅笔编辑图标 -->
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 3.3 完整年月日 -->
      <div class="date-line" id="date-display">2026年10月21日</div>

      <!-- 3.4 底部“分享这一刻”按钮 -->
      <button type="button" class="share-btn" id="share-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>

  <!-- 导出预览与保存弹窗 -->
  <div class="modal-backdrop" id="share-modal" role="dialog" aria-modal="true" aria-label="分享这一刻卡片预览">
    <div class="modal-card">
      <div class="modal-top">
        <span class="modal-title">已定格这一刻</span>
        <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="关闭预览">×</button>
      </div>
      <div class="preview-img-wrap">
        <img id="export-preview-img" alt="小星灵动态卡导出图片" />
      </div>
      <p class="modal-hint">手机上可直接长按上方图片保存，或点击下方按钮下载 / 分享</p>
      <div class="modal-actions">
        <button type="button" class="modal-action-btn primary" id="download-img-btn">保存图片</button>
        <button type="button" class="modal-action-btn secondary" id="native-share-btn">系统分享</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // 1. Storage & Persistent State
      // =========================================================================
      const STORAGE_KEYS = {
        author: 'xxl_pet_author_v1',
        message: 'xxl_pet_message_v1',
        theme: 'xxl_pet_theme_v1',
        sound: 'xxl_pet_sound_v1'
      };

      const memoryStorage = {};
      function safeGetStorage(key, fallback) {
        try {
          const val = window.localStorage.getItem(key);
          if (val !== null) return val;
        } catch (e) {}
        return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : fallback;
      }

      function safeSetStorage(key, val) {
        memoryStorage[key] = String(val);
        try {
          window.localStorage.setItem(key, String(val));
        } catch (e) {
          // Fallback to memoryStorage in sandboxed data-URI/iframe environments
        }
      }

      const appState = {
        author: safeGetStorage(STORAGE_KEYS.author, '星光桌伴'),
        message: safeGetStorage(STORAGE_KEYS.message, '歪一下脑袋观察新事物，想到好点子就突然亮起来！'),
        theme: safeGetStorage(STORAGE_KEYS.theme, 'cream'),
        soundEnabled: safeGetStorage(STORAGE_KEYS.sound, 'true') !== 'false',
        isEditing: false,
        dateString: ''
      };

      // Format full year-month-day
      function computeDateString() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}年${m}月${d}日`;
      }
      appState.dateString = computeDateString();

      // =========================================================================
      // 2. Synthesized Web Audio Sound Engine
      // =========================================================================
      let audioCtx = null;
      function ensureAudio() {
        if (!appState.soundEnabled) return null;
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            try {
              audioCtx = new AudioContextClass();
            } catch (e) {
              audioCtx = null;
            }
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playSound(type) {
        const ctx = ensureAudio();
        if (!ctx) return;
        const now = ctx.currentTime;

        function tone(freq, endFreq, startTime, duration, waveType, gainPeak) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = waveType || 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          if (endFreq && endFreq !== freq) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), startTime + duration);
          }
          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(gainPeak || 0.08, startTime + duration * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + duration + 0.02);
        }

        if (type === 'happy') {
          tone(523.25, 659.25, now, 0.14, 'sine', 0.08);
          tone(659.25, 783.99, now + 0.13, 0.18, 'sine', 0.09);
        } else if (type === 'celebrate') {
          tone(440, 493.88, now, 0.16, 'triangle', 0.07);
          tone(587.33, 659.25, now + 0.28, 0.12, 'triangle', 0.08);
          tone(783.99, 1046.5, now + 0.40, 0.28, 'sine', 0.10);
          tone(1046.5, 1318.5, now + 0.56, 0.30, 'sine', 0.08);
        } else if (type === 'sad') {
          tone(440, 370, now, 0.28, 'sine', 0.06);
          tone(360, 293.66, now + 0.26, 0.38, 'sine', 0.06);
        } else if (type === 'angry') {
          tone(220, 175, now, 0.12, 'triangle', 0.08);
          tone(240, 180, now + 0.15, 0.14, 'triangle', 0.08);
        } else if (type === 'sleep') {
          tone(493.88, 392.0, now, 0.35, 'sine', 0.05);
          tone(392.0, 329.63, now + 0.36, 0.45, 'sine', 0.04);
        } else if (type === 'pet') {
          tone(587.33, 740.0, now, 0.16, 'sine', 0.07);
          tone(740.0, 880.0, now + 0.14, 0.22, 'sine', 0.07);
        } else if (type === 'grab') {
          tone(420, 680, now, 0.14, 'sine', 0.07);
        } else if (type === 'drop') {
          tone(540, 360, now, 0.14, 'sine', 0.06);
          tone(360, 460, now + 0.12, 0.12, 'sine', 0.05);
        } else if (type === 'idea') {
          tone(784, 1174.66, now, 0.18, 'sine', 0.06);
        }
      }

      // =========================================================================
      // 3. Crayon / Paper Grain Pattern Generator (2D Hand-Drawn Sticker Texture)
      // =========================================================================
      const grainCanvas = document.createElement('canvas');
      grainCanvas.width = 96;
      grainCanvas.height = 96;
      (function buildGrain() {
        const gctx = grainCanvas.getContext('2d');
        let seed = 1337;
        function rand() {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        }
        for (let i = 0; i < 420; i++) {
          const x = rand() * 96;
          const y = rand() * 96;
          const r = 0.6 + rand() * 1.3;
          gctx.fillStyle = rand() > 0.45 ? 'rgba(74, 62, 61, 0.055)' : 'rgba(255, 255, 255, 0.09)';
          gctx.beginPath();
          gctx.arc(x, y, r, 0, Math.PI * 2);
          gctx.fill();
        }
      })();

      // =========================================================================
      // 4. Pet State Machine & Continuous Deformation Model ("小星灵")
      // =========================================================================
      const canvas = document.getElementById('pet-canvas');
      const ctx = canvas.getContext('2d');
      const W = 800;
      const H = 752;
      const HOME_X = 400;
      const HOME_Y = 365;
      const DESK_SHADOW_Y = 562;

      const pet = {
        // Current state: 'idle' | 'happy' | 'celebrate' | 'sad' | 'angry' | 'sleep' | 'pet' | 'drag' | 'drop'
        state: 'idle',
        stateTime: 0,
        stateDuration: 0,
        totalTime: 0,
        lastInteractionTime: performance.now(),

        // Curious observation / typing focus state
        focusActive: false,
        focusTimer: 0,
        ideaPulseTimer: 0,

        // Idle curious tilt-then-lightup cycle
        idleQuirkTimer: 2.2,
        idleQuirkPhase: 0, // 0: normal, 1: tilting curiously, 2: lighting up!

        // Pointer tracking
        pointerInScene: false,
        pointerX: HOME_X,
        pointerY: HOME_Y,
        isDragging: false,
        dragOffsetX: 0,
        dragOffsetY: 0,
        dragHoldTimer: 0,
        downStartX: 0,
        downStartY: 0,
        pointerDownActive: false,

        // Position & physics velocity
        x: HOME_X,
        y: HOME_Y,
        vx: 0,
        vy: 0,

        // Continuous spring-interpolated pose parameters
        pose: {
          offsetX: 0,
          offsetY: 0,
          scaleX: 1,
          scaleY: 1,
          rotation: 0,
          coreRadius: 84,
          lobeRadius: 58,
          // 4 star tips: 0=Top(-90deg), 1=Right(0deg), 2=Bottom(90deg), 3=Left(180deg)
          tipScale0: 1, tipScale1: 1, tipScale2: 1, tipScale3: 1,
          tipDX0: 0, tipDY0: 0,
          tipDX1: 0, tipDY1: 0,
          tipDX2: 0, tipDY2: 0,
          tipDX3: 0, tipDY3: 0,
          // Expressive eye parameters (NO eyebrows, NO mouth, NO limbs)
          eyeMode: 'normal', // 'normal' | 'happyArc' | 'celebrateStar' | 'sadDroop' | 'angryGlare' | 'sleepArc' | 'petSquint' | 'wideSurprise'
          eyeScaleX: 1,
          eyeScaleY: 1,
          gazeX: 0,
          gazeY: 0,
          blushAlpha: 0.22,
          glowIntensity: 0.15,
          angryTint: 0,
          sadDim: 0
        },

        // Particles (confetti, ribbons, hearts, sparkles, sleep bubbles, angry puffs)
        particles: []
      };

      // Helper for linear interpolation
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      // Update emotion buttons' filled highlight state
      const emotionButtons = document.querySelectorAll('.emotion-btn');
      function syncEmotionButtons() {
        const activeButtonStates = ['happy', 'celebrate', 'sad', 'angry', 'sleep'];
        const currentActive = activeButtonStates.includes(pet.state) ? pet.state : null;
        emotionButtons.forEach((btn) => {
          const emo = btn.getAttribute('data-emotion');
          if (emo === currentActive) {
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          } else {
            btn.classList.remove('active');
            btn.setAttribute('aria-pressed', 'false');
          }
        });
      }

      // Spawn rich colorful props with real physics
      function spawnCelebrationConfetti(originX, originY) {
        const palette = [
          '#FF6B6B', // Coral Red
          '#FFD166', // Sunny Yellow
          '#06D6A0', // Mint Green
          '#4CC9F0', // Sky Blue
          '#FF9F43', // Warm Tangerine
          '#F78CA2'  // Soft Rose
        ];
        // 34 confetti & curling ribbon streamers launched upward from around upper body
        for (let i = 0; i < 34; i++) {
          const spreadAngle = -Math.PI / 2 + (Math.random() - 0.5) * 1.45;
          const speed = 380 + Math.random() * 340;
          const shapes = ['rect', 'star', 'ribbon', 'circle'];
          const shape = shapes[i % shapes.length];
          pet.particles.push({
            kind: 'confetti',
            shape: shape,
            x: originX + (Math.random() - 0.5) * 70,
            y: originY - 25 + (Math.random() - 0.5) * 30,
            vx: Math.cos(spreadAngle) * speed,
            vy: Math.sin(spreadAngle) * speed - 90,
            gravity: 560 + Math.random() * 160,
            drag: 0.985,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 7,
            flipPhase: Math.random() * Math.PI * 2,
            flipSpeed: 5 + Math.random() * 6,
            swayPhase: Math.random() * Math.PI * 2,
            swayAmp: 35 + Math.random() * 45,
            size: shape === 'ribbon' ? 18 + Math.random() * 8 : 11 + Math.random() * 6,
            color: palette[i % palette.length],
            alpha: 1,
            age: 0,
            life: 2.3 + Math.random() * 0.9
          });
        }
      }

      function spawnPetHearts(originX, originY) {
        const heartColors = ['#FF7B8B', '#FFD166', '#52D1A6', '#6EC1F8'];
        for (let i = 0; i < 5; i++) {
          pet.particles.push({
            kind: 'heart',
            x: originX + (i - 2) * 34 + (Math.random() - 0.5) * 14,
            y: originY - 60 - Math.random() * 25,
            vx: (i - 2) * 18,
            vy: -75 - Math.random() * 35,
            rot: (Math.random() - 0.5) * 0.35,
            swayPhase: i * 1.3,
            size: 15 + (i % 2) * 4,
            color: heartColors[i % heartColors.length],
            alpha: 1,
            age: 0,
            life: 1.45 + Math.random() * 0.25
          });
        }
      }

      function spawnIdeaSparkles(originX, originY) {
        const colors = ['#FFD166', '#FF7B7B', '#4CC9F0', '#06D6A0'];
        for (let i = 0; i < 6; i++) {
          const ang = -Math.PI * 0.85 + (i / 5) * (Math.PI * 0.7);
          pet.particles.push({
            kind: 'sparkle',
            x: originX + Math.cos(ang) * 95,
            y: originY + Math.sin(ang) * 95,
            vx: Math.cos(ang) * 48,
            vy: Math.sin(ang) * 48,
            size: 11 + (i % 2) * 4,
            color: colors[i % colors.length],
            alpha: 1,
            age: 0,
            life: 0.75
          });
        }
      }

      // State transitions with smooth interruption handling
      function setPetState(newState, options) {
        options = options || {};
        pet.lastInteractionTime = performance.now();

        // If already in 'pet' and clicked again during main phase, gently refresh without jarring reset
        if (newState === 'pet' && pet.state === 'pet') {
          if (pet.stateTime > 0.28 && pet.stateTime < 1.35) {
            pet.stateTime = 0.32;
            spawnPetHearts(pet.x, pet.y);
            playSound('pet');
          }
          return;
        }

        pet.state = newState;
        pet.stateTime = 0;
        pet.celebrateBurstDone = false;

        if (newState === 'happy') {
          pet.stateDuration = 3.2;
          playSound('happy');
          spawnPetHearts(pet.x, pet.y - 10);
        } else if (newState === 'celebrate') {
          pet.stateDuration = 3.6;
          playSound('celebrate');
        } else if (newState === 'sad') {
          pet.stateDuration = 3.4;
          playSound('sad');
        } else if (newState === 'angry') {
          pet.stateDuration = 3.0;
          playSound('angry');
        } else if (newState === 'sleep') {
          // If triggered by button, play a 5.5s nap cycle then restore; if triggered by idle, stay until woken
          pet.stateDuration = options.fromIdle ? 99999 : 5.5;
          if (!options.fromIdle) playSound('sleep');
        } else if (newState === 'pet') {
          pet.stateDuration = 2.35;
          playSound('pet');
          spawnPetHearts(pet.x, pet.y);
        } else if (newState === 'drag') {
          pet.stateDuration = 99999;
          playSound('grab');
        } else if (newState === 'drop') {
          pet.stateDuration = 0.85;
          playSound('drop');
        } else {
          pet.state = 'idle';
          pet.stateDuration = 0;
        }

        syncEmotionButtons();
      }

      // Expose state setter on window for automated verification & inspection
      window.xiaoXingLingApp = {
        setPetState: setPetState,
        getPetState: () => pet,
        getSavedStorage: (k) => safeGetStorage(k, null),
        triggerTypingFocus: () => {
          pet.lastInteractionTime = performance.now();
          if (pet.state === 'sleep') {
            setPetState('idle');
          }
          pet.focusActive = true;
          pet.focusTimer = 2.6;
          pet.ideaPulseTimer = 0.9;
          spawnIdeaSparkles(pet.x, pet.y - 20);
          playSound('idea');
        },
        spawnCelebrationConfetti: () => spawnCelebrationConfetti(pet.x, pet.y - 30)
      };

      // =========================================================================
      // 5. Update Loop: Pose Calculation & Particle Physics
      // =========================================================================
      function updatePet(dt) {
        pet.totalTime += dt;
        pet.stateTime += dt;

        // Check idle sleep trigger (after 22 seconds of inactivity when in idle and not editing)
        const idleElapsedSec = (performance.now() - pet.lastInteractionTime) / 1000;
        if (pet.state === 'idle' && !appState.isEditing && idleElapsedSec > 22) {
          setPetState('sleep', { fromIdle: true });
        }

        // Handle timed state completion
        if (pet.stateDuration > 0 && pet.stateTime >= pet.stateDuration && pet.state !== 'drag') {
          pet.state = 'idle';
          pet.stateTime = 0;
          pet.stateDuration = 0;
          syncEmotionButtons();
        }

        // Update typing/focus timer
        if (pet.focusTimer > 0) {
          pet.focusTimer = Math.max(0, pet.focusTimer - dt);
          if (pet.focusTimer === 0 && !appState.isEditing) {
            pet.focusActive = false;
          }
        }
        if (pet.ideaPulseTimer > 0) {
          pet.ideaPulseTimer = Math.max(0, pet.ideaPulseTimer - dt);
        }

        // Position return spring when not dragging
        if (pet.state === 'drag') {
          // Smoothly follow pointer while clamped inside safe scene bounds
          const targetX = clamp(pet.pointerX + pet.dragOffsetX, 145, W - 145);
          const targetY = clamp(pet.pointerY + pet.dragOffsetY, 135, H - 220);
          const prevX = pet.x;
          const prevY = pet.y;
          pet.x = lerp(pet.x, targetX, Math.min(1, dt * 18));
          pet.y = lerp(pet.y, targetY, Math.min(1, dt * 18));
          pet.vx = (pet.x - prevX) / Math.max(0.008, dt);
          pet.vy = (pet.y - prevY) / Math.max(0.008, dt);
        } else if (pet.state === 'drop') {
          // Natural gravity fall + spring landing back to HOME_X, HOME_Y
          const springK = 110;
          const damping = 11;
          const ax = (HOME_X - pet.x) * (springK * 0.6) - pet.vx * damping;
          const ay = (HOME_Y - pet.y) * springK - pet.vy * damping + 180 * Math.max(0, 0.35 - pet.stateTime);
          pet.vx += ax * dt;
          pet.vy += ay * dt;
          pet.x += pet.vx * dt;
          pet.y += pet.vy * dt;
        } else {
          pet.x = lerp(pet.x, HOME_X, Math.min(1, dt * 7));
          pet.y = lerp(pet.y, HOME_Y, Math.min(1, dt * 7));
          pet.vx *= 0.85;
          pet.vy *= 0.85;
        }

        // Target pose defaults
        const t = pet.totalTime;
        const st = pet.stateTime;
        const target = {
          offsetX: 0,
          offsetY: Math.sin(t * 2.5) * 9,
          scaleX: 1 + Math.sin(t * 2.5) * 0.02,
          scaleY: 1 - Math.sin(t * 2.5) * 0.02,
          rotation: Math.sin(t * 1.4) * 0.035,
          coreRadius: 84,
          lobeRadius: 58,
          tipScale0: 1, tipScale1: 1, tipScale2: 1, tipScale3: 1,
          tipDX0: 0, tipDY0: 0,
          tipDX1: 0, tipDY1: 0,
          tipDX2: 0, tipDY2: 0,
          tipDX3: 0, tipDY3: 0,
          eyeMode: 'normal',
          eyeScaleX: 1,
          eyeScaleY: 1,
          gazeX: 0,
          gazeY: 0,
          blushAlpha: 0.22,
          glowIntensity: 0.15,
          angryTint: 0,
          sadDim: 0
        };

        // Periodic natural blink in normal eye mode
        const blinkCycle = t % 4.2;
        if (blinkCycle > 4.02 && blinkCycle < 4.16) {
          target.eyeScaleY = 0.12;
        }

        // Pointer proximity response & curious tilt
        if (pet.pointerInScene && pet.state === 'idle' && !pet.focusActive) {
          const dx = pet.pointerX - pet.x;
          const dy = pet.pointerY - pet.y;
          const dist = Math.hypot(dx, dy);
          target.gazeX = clamp(dx / 24, -8, 8);
          target.gazeY = clamp(dy / 26, -6, 6);
          if (dist < 240) {
            const prox = 1 - dist / 240;
            target.rotation += clamp(dx / 260, -0.18, 0.18) * prox;
            target.offsetY -= prox * 10;
            target.glowIntensity = 0.22 + prox * 0.25;
            target.tipDY0 = -prox * 6;
          }
        }

        // Idle personality quirk: "遇到问题先歪一下身体，想到办法时突然亮起来"
        if (pet.state === 'idle' && !pet.focusActive && !pet.pointerInScene) {
          const qCycle = t % 7.5;
          if (qCycle > 4.5 && qCycle < 5.7) {
            // Curious head/body tilt first
            target.rotation = 0.22;
            target.gazeX = 5;
            target.gazeY = -4;
            target.tipDX0 = 10;
            target.tipDY1 = -5;
          } else if (qCycle >= 5.7 && qCycle < 6.7) {
            // Sudden bright "Aha!" light-up + little perk hop
            target.rotation = -0.04;
            target.offsetY = -16;
            target.scaleX = 1.05;
            target.scaleY = 1.05;
            target.glowIntensity = 0.88;
            target.eyeMode = 'celebrateStar';
            target.tipScale0 = 1.1;
            target.tipScale1 = 1.08;
            target.tipScale3 = 1.08;
          }
        }

        // Typing / Editing Focus Reaction: tilts body curiously and watches text area below
        if ((pet.focusActive || appState.isEditing) && pet.state === 'idle') {
          target.offsetY = 18 + Math.sin(t * 3.5) * 4;
          target.rotation = 0.24 + Math.sin(t * 2.2) * 0.04; // Curious tilt!
          target.gazeX = Math.sin(t * 4.0) * 5;
          target.gazeY = 8.5; // Looking down at the caption text box
          target.eyeScaleX = 1.08;
          target.eyeScaleY = 1.12;
          target.tipDX0 = 12;
          target.tipDY1 = 4;
          target.tipDY3 = -6;
          if (pet.ideaPulseTimer > 0) {
            target.glowIntensity = 0.92;
            target.eyeMode = 'celebrateStar';
            target.offsetY -= 12;
          } else {
            target.glowIntensity = 0.35;
          }
        }

        // Specific Emotion & Interaction States
        if (pet.state === 'happy') {
          // 高兴：欢快轻摇慢跳、弯弯笑眼、左右星角愉悦上扬（与庆祝的高空发光旋转撒彩纸一眼区分）
          const bounce = Math.abs(Math.sin(st * 5.2));
          const sway = Math.sin(st * 5.2);
          target.offsetX = sway * 16;
          target.offsetY = -bounce * 22;
          target.scaleX = 1.05 - bounce * 0.03;
          target.scaleY = 0.96 + bounce * 0.06;
          target.rotation = sway * 0.15;
          target.eyeMode = 'happyArc';
          target.blushAlpha = 0.62;
          target.glowIntensity = 0.42;
          // Star tips curve warmly upward
          target.tipScale0 = 1.06;
          target.tipScale1 = 1.08;
          target.tipScale3 = 1.08;
          target.tipDY1 = -18;
          target.tipDY3 = -18;
          target.tipDX0 = sway * 12;

        } else if (pet.state === 'celebrate') {
          // 庆祝：体现性格——先歪一下身体蓄力(0~0.38s)，随后突然亮起来高高跃起+四角舒展发光+星瞳+持续抛出彩色纸带与彩纸！
          if (st < 0.55) {
            const p = st / 0.55;
            target.offsetX = -14 * p;
            target.offsetY = 22 * p;
            target.scaleX = 1 + 0.12 * p;
            target.scaleY = 1 - 0.14 * p;
            target.rotation = -0.32 * p; // Tilts body curiously first!
            target.eyeMode = 'normal';
            target.eyeScaleX = 1.12;
            target.eyeScaleY = 1.12;
            target.gazeX = -5;
            target.gazeY = -5;
            target.tipDX0 = -18 * p;
            target.tipDY1 = 10 * p;
            target.glowIntensity = 0.25 + 0.2 * p;
          } else {
            if (!pet.celebrateBurstDone) {
              pet.celebrateBurstDone = true;
              spawnCelebrationConfetti(pet.x, pet.y - 45);
              spawnIdeaSparkles(pet.x, pet.y - 45);
            }
            // Also spawn secondary confetti bursts so confetti is always lively during celebrate
            if (Math.floor((st - dt - 0.55) * 1.6) < Math.floor((st - 0.55) * 1.6) && st < 3.2) {
              spawnCelebrationConfetti(pet.x, pet.y - 55);
            }
            const activeT = st - 0.55;
            const hop = Math.abs(Math.sin(activeT * 6.5));
            const energeticTilt = Math.sin(activeT * 6.5) * 0.24;
            target.offsetY = -54 - hop * 24;
            target.offsetX = Math.sin(activeT * 3.2) * 16;
            target.scaleX = 1.08 + hop * 0.06;
            target.scaleY = 1.08 + hop * 0.06;
            target.rotation = energeticTilt;
            target.eyeMode = 'celebrateStar';
            target.blushAlpha = 0.68;
            target.glowIntensity = 1.0; // Brightly lit!
            // All 4 star tips stretch proudly outward & upward
            target.tipScale0 = 1.24;
            target.tipScale1 = 1.25;
            target.tipScale2 = 1.18;
            target.tipScale3 = 1.25;
            target.tipDY0 = -14;
            target.tipDY1 = -20;
            target.tipDX1 = 12;
            target.tipDY3 = -20;
            target.tipDX3 = -12;
          }

        } else if (pet.state === 'sad') {
          // 难受：重心明显下沉、身体微缩、顶部与左右星角软塌下垂、八字委屈半阖眼（与生气的鼓起前倾锐利眼神完全不同）
          const tremble = Math.sin(st * 18) * 2.2;
          target.offsetX = -8 + tremble;
          target.offsetY = 48; // Sinks low toward desk
          target.scaleX = 0.95;
          target.scaleY = 0.84;
          target.rotation = -0.18;
          target.eyeMode = 'sadDroop';
          target.gazeX = -3;
          target.gazeY = 6;
          target.blushAlpha = 0.06;
          target.glowIntensity = 0.04;
          target.sadDim = 0.35;
          // Star tips droop heavily downward like wilted star ears
          target.tipScale0 = 0.90;
          target.tipScale1 = 0.94;
          target.tipScale2 = 0.84;
          target.tipScale3 = 0.94;
          target.tipDX0 = -24;
          target.tipDY0 = 24;
          target.tipDY1 = 36;
          target.tipDX1 = -8;
          target.tipDY3 = 36;
          target.tipDX3 = 8;
          target.tipDY2 = 12;

        } else if (pet.state === 'angry') {
          // 生气：身体鼓起紧绷、重心微抬前倾、四个星角硬挺外张、眼神向内斜压锐利、高频急促震颤
          const shake = Math.sin(st * 42) * 3.8;
          const puff = 1 + Math.sin(st * 8) * 0.04;
          target.offsetX = shake;
          target.offsetY = -14;
          target.scaleX = 1.12 * puff;
          target.scaleY = 1.08 * puff;
          target.rotation = Math.sin(st * 10) * 0.08;
          target.eyeMode = 'angryGlare';
          target.gazeX = 0;
          target.gazeY = -1;
          target.blushAlpha = 0.68;
          target.glowIntensity = 0.38;
          target.angryTint = 0.58;
          // Star tips bristle outward tautly
          target.tipScale0 = 1.22;
          target.tipScale1 = 1.24;
          target.tipScale2 = 1.18;
          target.tipScale3 = 1.24;
          target.tipDY0 = -10;
          target.tipDY1 = -14;
          target.tipDX1 = 14;
          target.tipDY3 = -14;
          target.tipDX3 = -14;

        } else if (pet.state === 'sleep') {
          // 睡觉：低空平稳漂浮、身体柔和微扁、顶角像睡帽一样自然弯向一侧、眼睛闭合呈安详下弧线、背景颜色不变
          const breath = Math.sin(st * 1.8);
          target.offsetX = 4;
          target.offsetY = 40 + breath * 5;
          target.scaleX = 1.08 + breath * 0.025;
          target.scaleY = 0.86 - breath * 0.02;
          target.rotation = 0.12;
          target.eyeMode = 'sleepArc';
          target.blushAlpha = 0.34;
          target.glowIntensity = 0.12 + (breath + 1) * 0.06;
          // Top star tip curls softly to the right like a sleepy nightcap
          target.tipScale0 = 0.96;
          target.tipDX0 = 32;
          target.tipDY0 = 20;
          target.tipDY1 = 16;
          target.tipDY3 = 14;
          target.tipScale2 = 0.85;

          // Periodically emit soft sleep stardust bubble
          if (Math.floor((st - dt) * 1.1) < Math.floor(st * 1.1)) {
            pet.particles.push({
              kind: 'sleepBubble',
              x: pet.x + 52,
              y: pet.y - 34,
              vx: 14 + Math.random() * 10,
              vy: -28 - Math.random() * 10,
              size: 8 + Math.random() * 6,
              color: '#A5D8FF',
              alpha: 0.9,
              age: 0,
              life: 2.0
            });
          }

        } else if (pet.state === 'pet') {
          // 抚摸：准备(0~0.25s) -> 主动作享受依偎眯眼(0.25~1.85s) -> 收尾回弹(1.85~2.35s)
          if (st < 0.25) {
            // Phase 1: Prep (gentle touch squash & notice)
            const p = st / 0.25;
            target.offsetY = 14 * p;
            target.scaleX = 1 + 0.10 * p;
            target.scaleY = 1 - 0.10 * p;
            target.rotation = 0.10 * p;
            target.eyeMode = 'petSquint';
            target.blushAlpha = 0.35 + 0.30 * p;
            target.tipDY0 = 12 * p;
          } else if (st < 1.85) {
            // Phase 2: Main affectionate nuzzle & blissful squint
            const m = (st - 0.25) / 1.60;
            const nuzzle = Math.sin(m * Math.PI * 2);
            target.offsetX = 14 + nuzzle * 12;
            target.offsetY = 8 - Math.sin(m * Math.PI) * 10;
            target.scaleX = 1.09 + Math.sin(m * Math.PI) * 0.04;
            target.scaleY = 0.92 - Math.sin(m * Math.PI) * 0.03;
            target.rotation = 0.24 + nuzzle * 0.09;
            target.eyeMode = 'petSquint';
            target.blushAlpha = 0.75;
            target.glowIntensity = 0.60;
            target.tipDX0 = 26 + nuzzle * 8;
            target.tipDY0 = 12;
            target.tipDY1 = -10;
            target.tipDY3 = 10;
          } else {
            // Phase 3: Smooth settle back to idle
            const r = (st - 1.85) / 0.50;
            const easeOut = Math.max(0, 1 - r);
            target.offsetX = 10 * easeOut;
            target.offsetY = -8 * Math.sin(r * Math.PI);
            target.scaleX = 1 + 0.04 * easeOut;
            target.scaleY = 1 - 0.03 * easeOut;
            target.rotation = 0.16 * easeOut;
            target.eyeMode = r < 0.45 ? 'petSquint' : 'normal';
            target.blushAlpha = 0.22 + 0.45 * easeOut;
            target.glowIntensity = 0.15 + 0.35 * easeOut;
          }

        } else if (pet.state === 'drag') {
          // 被抓起：受重力轻微纵向拉长、底部与两侧星角自然下垂摆动、圆睁惊讶小眼睛
          const swing = clamp(-pet.vx * 0.035, -24, 24) + Math.sin(st * 7) * 6;
          target.offsetX = 0;
          target.offsetY = 0;
          target.scaleX = 0.91;
          target.scaleY = 1.15;
          target.rotation = clamp(-pet.vx * 0.0008, -0.28, 0.28) + Math.sin(st * 6) * 0.05;
          target.eyeMode = 'wideSurprise';
          target.gazeX = clamp(pet.vx * 0.015, -5, 5);
          target.gazeY = clamp(pet.vy * 0.015 + 2, -5, 6);
          target.blushAlpha = 0.38;
          target.glowIntensity = 0.36;
          // Top tip pinched/stretched upward, bottom & side tips dangle downward with swing
          target.tipScale0 = 1.16;
          target.tipDY0 = -16;
          target.tipScale2 = 1.18;
          target.tipDY2 = 22;
          target.tipDX2 = swing;
          target.tipDY1 = 14;
          target.tipDX1 = swing * 0.5;
          target.tipDY3 = 14;
          target.tipDX3 = swing * 0.5;

        } else if (pet.state === 'drop') {
          // 松手落下并回弹
          const p = st / Math.max(0.01, pet.stateDuration);
          const bounceEnv = Math.exp(-p * 4.5) * Math.cos(p * Math.PI * 3.5);
          target.scaleX = 1 + bounceEnv * 0.16;
          target.scaleY = 1 - bounceEnv * 0.16;
          target.rotation = Math.sin(p * Math.PI * 2) * 0.08 * (1 - p);
          target.eyeMode = p < 0.35 ? 'wideSurprise' : 'normal';
          target.tipDY1 = bounceEnv * 14;
          target.tipDY3 = bounceEnv * 14;
          target.tipDY2 = -bounceEnv * 10;
        }

        // Smoothly interpolate current pose toward target pose (prevents any sudden jumps!)
        const k = Math.min(1, dt * 13);
        const pose = pet.pose;
        pose.offsetX = lerp(pose.offsetX, target.offsetX, k);
        pose.offsetY = lerp(pose.offsetY, target.offsetY, k);
        pose.scaleX = lerp(pose.scaleX, target.scaleX, k);
        pose.scaleY = lerp(pose.scaleY, target.scaleY, k);
        pose.rotation = lerp(pose.rotation, target.rotation, k);
        pose.tipScale0 = lerp(pose.tipScale0, target.tipScale0, k);
        pose.tipScale1 = lerp(pose.tipScale1, target.tipScale1, k);
        pose.tipScale2 = lerp(pose.tipScale2, target.tipScale2, k);
        pose.tipScale3 = lerp(pose.tipScale3, target.tipScale3, k);
        pose.tipDX0 = lerp(pose.tipDX0, target.tipDX0, k);
        pose.tipDY0 = lerp(pose.tipDY0, target.tipDY0, k);
        pose.tipDX1 = lerp(pose.tipDX1, target.tipDX1, k);
        pose.tipDY1 = lerp(pose.tipDY1, target.tipDY1, k);
        pose.tipDX2 = lerp(pose.tipDX2, target.tipDX2, k);
        pose.tipDY2 = lerp(pose.tipDY2, target.tipDY2, k);
        pose.tipDX3 = lerp(pose.tipDX3, target.tipDX3, k);
        pose.tipDY3 = lerp(pose.tipDY3, target.tipDY3, k);
        pose.eyeScaleX = lerp(pose.eyeScaleX, target.eyeScaleX, Math.min(1, dt * 18));
        pose.eyeScaleY = lerp(pose.eyeScaleY, target.eyeScaleY, Math.min(1, dt * 18));
        pose.gazeX = lerp(pose.gazeX, target.gazeX, Math.min(1, dt * 14));
        pose.gazeY = lerp(pose.gazeY, target.gazeY, Math.min(1, dt * 14));
        pose.blushAlpha = lerp(pose.blushAlpha, target.blushAlpha, k);
        pose.glowIntensity = lerp(pose.glowIntensity, target.glowIntensity, k);
        pose.angryTint = lerp(pose.angryTint, target.angryTint, k);
        pose.sadDim = lerp(pose.sadDim, target.sadDim, k);
        pose.eyeMode = target.eyeMode;

        // Update particles
        for (let i = pet.particles.length - 1; i >= 0; i--) {
          const pt = pet.particles[i];
          pt.age += dt;
          if (pt.age >= pt.life) {
            pet.particles.splice(i, 1);
            continue;
          }
          const lifeRatio = pt.age / pt.life;
          if (pt.kind === 'confetti') {
            pt.vy += pt.gravity * dt;
            pt.vx *= Math.pow(pt.drag, dt * 60);
            pt.x += (pt.vx + Math.sin(pt.age * 5.5 + pt.swayPhase) * pt.swayAmp) * dt;
            pt.y += pt.vy * dt;
            pt.rot += pt.vRot * dt;
            pt.flipPhase += pt.flipSpeed * dt;
            pt.alpha = lifeRatio > 0.78 ? (1 - lifeRatio) / 0.22 : 1;
          } else if (pt.kind === 'heart') {
            pt.x += (pt.vx + Math.sin(pt.age * 5 + pt.swayPhase) * 24) * dt;
            pt.y += pt.vy * dt;
            pt.alpha = lifeRatio > 0.65 ? (1 - lifeRatio) / 0.35 : 1;
          } else if (pt.kind === 'sparkle' || pt.kind === 'sleepBubble') {
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.alpha = 1 - lifeRatio;
          }
        }
      }

      // =========================================================================
      // 6. 2D Hand-Drawn Sticker Scene & Character Rendering
      // =========================================================================
      function drawRoundedRect(c, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + rr, y);
        c.arcTo(x + w, y, x + w, y + h, rr);
        c.arcTo(x + w, y + h, x, y + h, rr);
        c.arcTo(x, y + h, x, y, rr);
        c.arcTo(x, y, x + w, y, rr);
        c.closePath();
      }

      function drawSmallStarShape(c, cx, cy, outerR, innerR, rot) {
        c.beginPath();
        for (let i = 0; i < 8; i++) {
          const ang = (rot || 0) + (i * Math.PI) / 4;
          const rad = i % 2 === 0 ? outerR : innerR;
          const px = cx + Math.cos(ang) * rad;
          const py = cy + Math.sin(ang) * rad;
          if (i === 0) c.moveTo(px, py);
          else c.lineTo(px, py);
        }
        c.closePath();
      }

      function drawHeartShape(c, cx, cy, size) {
        const s = size * 0.55;
        c.beginPath();
        c.moveTo(cx, cy + s * 0.85);
        c.bezierCurveTo(cx - s * 1.4, cy + s * 0.1, cx - s * 1.3, cy - s * 1.0, cx, cy - s * 0.35);
        c.bezierCurveTo(cx + s * 1.3, cy - s * 1.0, cx + s * 1.4, cy + s * 0.1, cx, cy + s * 0.85);
        c.closePath();
      }

      // Compute the 128 smooth contour points of 小星灵's plump 4-pointed star body
      function computeStarContourPoints(pose) {
        const N = 128;
        const pts = [];
        const tipAngles = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];
        const tipScales = [pose.tipScale0, pose.tipScale1, pose.tipScale2, pose.tipScale3];
        const tipDX = [pose.tipDX0, pose.tipDX1, pose.tipDX2, pose.tipDX3];
        const tipDY = [pose.tipDY0, pose.tipDY1, pose.tipDY2, pose.tipDY3];
        const quarterPi = Math.PI / 4;

        for (let k = 0; k < N; k++) {
          const theta = (k / N) * Math.PI * 2;
          let rLobeSum = 0;
          let dxSum = 0;
          let dySum = 0;

          for (let i = 0; i < 4; i++) {
            // Shortest angular distance to tip i
            const diff = Math.atan2(Math.sin(theta - tipAngles[i]), Math.cos(theta - tipAngles[i]));
            const absDiff = Math.abs(diff);
            // Each of the 4 star lobes spans [-pi/4, +pi/4] around its tip angle and reaches 0 smoothly at the 4 waist valleys
            if (absDiff < quarterPi) {
              const raisedCos = 0.5 + 0.5 * Math.cos(4 * diff); // 1 at tip, 0 at waist valley with 0 derivative
              const u = Math.pow(raisedCos, 1.52); // Smooth concave star waist + rounded plump star tips (✦)
              rLobeSum += pose.lobeRadius * tipScales[i] * u;
              const uBend = Math.pow(raisedCos, 1.20);
              dxSum += tipDX[i] * uBend;
              dySum += tipDY[i] * uBend;
            }
          }

          const r = pose.coreRadius + rLobeSum;
          const x0 = Math.cos(theta) * r;
          const y0 = Math.sin(theta) * r;

          pts.push({
            x: x0 * pose.scaleX + dxSum,
            y: y0 * pose.scaleY + dySum
          });
        }
        return pts;
      }

      function traceSmoothClosedContour(c, pts) {
        const n = pts.length;
        if (!n) return;
        c.beginPath();
        const mid0X = (pts[n - 1].x + pts[0].x) * 0.5;
        const mid0Y = (pts[n - 1].y + pts[0].y) * 0.5;
        c.moveTo(mid0X, mid0Y);
        for (let i = 0; i < n; i++) {
          const p0 = pts[i];
          const p1 = pts[(i + 1) % n];
          const midX = (p0.x + p1.x) * 0.5;
          const midY = (p0.y + p1.y) * 0.5;
          c.quadraticCurveTo(p0.x, p0.y, midX, midY);
        }
        c.closePath();
      }

      // Draw the cozy hand-drawn study desk scene ("轻轻漂浮在桌面上方")
      function drawDeskScene(c, time, starX, starY, pose) {
        // 1. Warm Cream Wall Background (NEVER changes color during sleep!)
        const wallGrad = c.createLinearGradient(0, 0, 0, 500);
        wallGrad.addColorStop(0, '#FDF8F0');
        wallGrad.addColorStop(1, '#F5EBDC');
        c.fillStyle = wallGrad;
        c.fillRect(0, 0, W, H);

        // Soft diagonal warm window sunbeam
        c.save();
        c.fillStyle = 'rgba(255, 245, 214, 0.52)';
        c.beginPath();
        c.moveTo(0, 0);
        c.lineTo(340, 0);
        c.lineTo(620, 505);
        c.lineTo(110, 505);
        c.closePath();
        c.fill();
        c.restore();

        // Top-left window frame edge & hanging paper star mobile
        c.save();
        c.fillStyle = '#FFFDF9';
        c.strokeStyle = '#5C4D4B';
        c.lineWidth = 3;
        drawRoundedRect(c, -18, -18, 175, 195, 16);
        c.fill();
        c.stroke();

        c.fillStyle = '#E6F4FF';
        drawRoundedRect(c, -8, -8, 146, 166, 10);
        c.fill();
        c.stroke();

        // Hanging mobile strings & gentle swaying paper stars
        const sway1 = Math.sin(time * 1.4) * 5;
        const sway2 = Math.cos(time * 1.7) * 5;
        c.strokeStyle = '#6D5D5B';
        c.lineWidth = 2.2;
        c.beginPath();
        c.moveTo(62, 0);
        c.lineTo(62 + sway1, 76);
        c.moveTo(112, 0);
        c.lineTo(112 + sway2, 54);
        c.stroke();

        c.fillStyle = '#FFD166';
        drawSmallStarShape(c, 62 + sway1, 84, 15, 7.5, sway1 * 0.03);
        c.fill();
        c.stroke();

        c.fillStyle = '#7CC6FE';
        drawSmallStarShape(c, 112 + sway2, 62, 12, 6, -sway2 * 0.03);
        c.fill();
        c.stroke();
        c.restore();

        // Top-right constellation memo note with washi tape
        c.save();
        c.translate(682, 86);
        c.rotate(0.06);
        c.fillStyle = 'rgba(74, 62, 61, 0.08)';
        drawRoundedRect(c, -56, -42, 116, 96, 10);
        c.fill();

        c.fillStyle = '#FFF9E6';
        c.strokeStyle = '#5C4D4B';
        c.lineWidth = 2.8;
        drawRoundedRect(c, -60, -46, 116, 96, 10);
        c.fill();
        c.stroke();

        // Mint washi tape strip at top of note
        c.fillStyle = '#8CE9C6';
        c.save();
        c.rotate(-0.08);
        drawRoundedRect(c, -26, -55, 54, 16, 4);
        c.fill();
        c.stroke();
        c.restore();

        // Little constellation doodle on memo
        c.strokeStyle = '#D4A359';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(-30, 8);
        c.lineTo(-4, -12);
        c.lineTo(24, 4);
        c.stroke();
        const dots = [[-30, 8, '#FF7B7B'], [-4, -12, '#FFD166'], [24, 4, '#6EC1F8']];
        dots.forEach((d) => {
          c.fillStyle = d[2];
          c.beginPath();
          c.arc(d[0], d[1], 4.5, 0, Math.PI * 2);
          c.fill();
        });
        c.restore();

        // 2. Warm Honey-Oak Study Desk Surface (Lower 33% of canvas)
        const deskTopY = 500;
        const deskGrad = c.createLinearGradient(0, deskTopY, 0, H);
        deskGrad.addColorStop(0, '#EED7BA');
        deskGrad.addColorStop(0.82, '#E2C4A0');
        deskGrad.addColorStop(0.83, '#CFAF89');
        deskGrad.addColorStop(1, '#C5A37B');
        c.fillStyle = deskGrad;
        c.fillRect(0, deskTopY, W, H - deskTopY);

        // Desk top horizon line & front edge line
        c.strokeStyle = '#5C4D4B';
        c.lineWidth = 3.2;
        c.beginPath();
        c.moveTo(0, deskTopY);
