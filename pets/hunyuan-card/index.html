<!DOCTYPE html>
<html lang="zh-CN" data-theme="mint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#FCF6ED">
<meta name="description" content="喵仔 —— 一只住在你桌面上的机器人小猫。摸摸它，给它一点彩纸。">
<title>喵仔 · 桌面小猫</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <article class="card" id="card">

    <!-- ================= 顶部 ================= -->
    <header class="card-head">
      <div class="avatar" id="avatar"></div>
      <div class="who">
        <h1 class="name">喵仔</h1>
        <p class="sub">WorkBuddy · 桌面小猫</p>
      </div>
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="设置" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="5" cy="12" r="1.9" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.9" fill="currentColor"/>
          <circle cx="19" cy="12" r="1.9" fill="currentColor"/>
        </svg>
      </button>

      <div class="menu" id="menu" hidden>
        <div class="menu-row">
          <span class="menu-label">音效</span>
          <button class="switch" id="soundToggle" role="switch" aria-checked="true"><i></i></button>
        </div>
        <div class="menu-sep"></div>
        <div class="menu-row menu-col">
          <span class="menu-label">卡片配色</span>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="menu-sep"></div>
        <button class="menu-item" id="resetText">恢复默认文字</button>
      </div>
    </header>

    <!-- ================= 场景 ================= -->
    <div class="stage" id="stage" aria-label="喵仔的房间"></div>

    <!-- ================= 动作 ================= -->
    <div class="actions" id="actions">
      <button class="act" data-act="happy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.6 13.4c.9 1.5 2.1 2.2 3.4 2.2s2.5-.7 3.4-2.2"/><path d="M9.4 9.6h.02M14.6 9.6h.02"/></svg>
        <span>高兴</span>
      </button>
      <button class="act" data-act="celebrate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.8 12.1 8 15.3 9.1 12.1 10.2 11 13.4 9.9 10.2 6.7 9.1 9.9 8Z"/><path d="M17 13.6l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7Z"/><path d="M6.6 15.2 5.4 19l3.8-1.2"/></svg>
        <span>庆祝</span>
      </button>
      <button class="act" data-act="sad">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.4 16c.9-1.4 2.1-2.1 3.6-2.1s2.7.7 3.6 2.1"/><path d="M9.4 9.6h.02M14.6 9.6h.02"/></svg>
        <span>难受</span>
      </button>
      <button class="act" data-act="angry">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M7.8 8.2 10.4 9.4M16.2 8.2 13.6 9.4"/><path d="M9.2 15.4c.8-.9 1.8-1.3 2.8-1.3s2 .4 2.8 1.3"/></svg>
        <span>生气</span>
      </button>
      <button class="act" data-act="sleep">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.4 8.4 0 1 0 10.6 10.6Z"/></svg>
        <span>睡觉</span>
      </button>
    </div>

    <!-- ================= 文字 ================= -->
    <div class="texts">
      <div class="text-row">
        <button class="pencil" data-edit="sign" aria-label="编辑署名">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/><path d="M14.9 8.1 15.9 9.1 10.6 14.4 9.1 14.9 9.6 13.4Z"/></svg>
        </button>
        <div class="edit sign" id="sign" contenteditable="true" role="textbox" aria-label="署名" data-placeholder="写下你的署名"></div>
      </div>
      <div class="text-row">
        <button class="pencil" data-edit="talk" aria-label="编辑今天的话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/><path d="M14.9 8.1 15.9 9.1 10.6 14.4 9.1 14.9 9.6 13.4Z"/></svg>
        </button>
        <div class="edit talk" id="talk" contenteditable="true" role="textbox" aria-label="今天的话" data-placeholder="今天想说点什么"></div>
      </div>
      <p class="date" id="date"></p>
    </div>

    <button class="share" id="shareBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4.4"/><path d="M8.4 7.8 12 4.2l3.6 3.6"/><path d="M5.6 13.4v5c0 .8.6 1.4 1.4 1.4h10c.8 0 1.4-.6 1.4-1.4v-5"/></svg>
      分享这一刻
    </button>
  </article>
  <p class="hint-bottom">点一下它 · 按住可以拎起来 · 闲置一会儿它会睡着</p>
</main>

<!-- ================= 分享预览 ================= -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="分享这一刻">
    <div class="sheet-head">
      <span>这一刻</span>
      <button class="icon-btn" id="sheetClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <div class="sheet-img"><img id="shotImg" alt="当前卡片截图"></div>
    <p class="sheet-tip" id="sheetTip">长按图片可以保存到相册</p>
    <div class="sheet-actions">
      <a class="btn ghost" id="downloadBtn" download="miao-moment.png">保存图片</a>
      <button class="btn primary" id="systemShare" hidden>系统分享</button>
    </div>
  </div>
</div>

<script src="js/paper.js"></script>
<script src="js/art-parts.js"></script>
<script src="js/pet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
