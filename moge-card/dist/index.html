<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d5dce6">
  <meta name="description" content="墨格，住在夜窗陶碟里的软墨球。抚摸、拖动，保存你们的今日卡片。">
  <title>墨格</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="orb.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <article class="pet-card" aria-label="墨格的今日卡片">
      <header class="card-head">
        <div class="identity">
          <canvas id="avatar" width="192" height="192" aria-hidden="true"></canvas>
          <h1>墨格</h1>
        </div>
        <button class="icon-button menu-toggle" id="menu-toggle" aria-label="配色和声音" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        </button>
        <div class="settings" id="settings" hidden>
          <div class="setting-label">卡片配色</div>
          <div class="swatches" role="group" aria-label="配色">
            <button data-theme="dusk" aria-label="夜窗" aria-pressed="true"></button>
            <button data-theme="lamp" aria-label="暖灯" aria-pressed="false"></button>
            <button data-theme="moss" aria-label="青苔" aria-pressed="false"></button>
            <button data-theme="rose" aria-label="暮粉" aria-pressed="false"></button>
          </div>
          <div class="sound-row">
            <label for="sound">互动声音</label>
            <button id="sound" class="switch" role="switch" aria-checked="false" aria-label="互动声音"><span></span></button>
          </div>
        </div>
      </header>
      <div class="scene" id="scene">
        <canvas id="pet" role="button" tabindex="0" aria-label="墨格，点击抚摸，按住拖动；键盘空格抚摸，方向键移动"></canvas>
      </div>
      <div class="card-bottom">
        <nav class="actions" aria-label="墨格的动作">
          <button data-action="happy" aria-pressed="false"><svg viewBox="0 0 28 28"><path d="M14 23S3 17.5 3 10.5A5.8 5.8 0 0 1 14 8a5.8 5.8 0 0 1 11 2.5C25 17.5 14 23 14 23Z"/></svg><span>高兴</span></button>
          <button data-action="celebrate" aria-pressed="false"><svg viewBox="0 0 28 28"><path d="m5 23 4-14 10 10-14 4Z"/><path class="detail" d="m10 9 9 10M15 5l1-2m6 8 3-1M18 8l3-3M10 4l-1-2M24 17h2"/></svg><span>庆祝</span></button>
          <button data-action="sad" aria-pressed="false"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="10"/><path class="detail" d="M9 12h.1M19 12h.1M10 19q4-4 8 0"/></svg><span>难受</span></button>
          <button data-action="angry" aria-pressed="false"><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="10"/><path class="detail" d="m8 12 4 2m8-2-4 2M10 19h8"/></svg><span>生气</span></button>
          <button data-action="sleep" aria-pressed="false"><svg viewBox="0 0 28 28"><path d="M23 17A10 10 0 0 1 11 4a10.5 10.5 0 1 0 12 13Z"/><path class="detail" d="m19 3 1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z"/></svg><span>睡觉</span></button>
        </nav>
        <div class="journal">
          <div class="author-row">
            <span id="signature" role="textbox" aria-label="署名" contenteditable="false" data-limit="24" spellcheck="false">和墨格</span>
            <button class="edit-button" data-edit="signature" aria-label="编辑署名"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M13 8.2 15.8 11 9.2 17.6 6.4 17.6 6.4 14.8 13 8.2Z"/></svg></button>
          </div>
          <div class="note-row">
            <div id="note" role="textbox" aria-label="今天的话" aria-multiline="true" contenteditable="false" data-limit="240" data-placeholder="写下今天的话…" spellcheck="false"></div>
            <button class="edit-button" data-edit="note" aria-label="编辑今天的话"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M13 8.2 15.8 11 9.2 17.6 6.4 17.6 6.4 14.8 13 8.2Z"/></svg></button>
          </div>
          <time id="date"></time>
        </div>
        <div class="share-row">
          <button id="share" class="share-button"><svg viewBox="0 0 24 24"><path d="m3 10 18-7-7 18-3-8-8-3Z"/><path d="m11 13 5-5"/></svg><span>分享这一刻</span></button>
        </div>
      </div>
    </article>
  </main>
  <dialog id="share-dialog" aria-labelledby="share-title">
    <div class="dialog-head">
      <h2 id="share-title">保存这一刻</h2>
      <button class="icon-button" id="close-share" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="image-wrap"><img id="share-image" alt="此刻的墨格和你的文字卡片"></div>
    <p class="save-hint">长按图片可保存到相册</p>
    <div class="save-actions">
      <a id="download" download="墨格.png">保存图片</a>
      <button id="system-share">系统分享</button>
    </div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
